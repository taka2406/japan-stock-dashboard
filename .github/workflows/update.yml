name: Update Japan Stocks

on:
  # 毎週月〜金の日本時間11:00と16:00に自動実行
  schedule:
    # 日本時間 11:00 = UTC 02:00
    - cron: '0 2 * * 1-5'

    # 日本時間 16:00 = UTC 07:00
    - cron: '0 7 * * 1-5'

  # GitHub Actions画面から手動実行も可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ライブラリをインストール
        run: |
          pip install -r requirements.txt

      - name: 株価データを取得
        run: |
          python update_stocks.py

      - name: data.jsonを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Update stock data"

          git push
