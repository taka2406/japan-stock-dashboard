<script>


/* ==================================================
   グローバル
================================================== */

let DATA = null;

let selectedPeriod = "1m";

let industryChart = null;

let themeChart = null;

let detailCharts = {};

let detailPeriods = {};


/* ==================================================
   グラフカラー
================================================== */

const chartColors = [

    "#e74c3c",
    "#3498db",
    "#2ecc71",
    "#9b59b6",
    "#f39c12",
    "#1abc9c",
    "#e67e22",
    "#34495e",
    "#e84393",
    "#16a085"

];


/* ==================================================
   ランキング展開状態
================================================== */

let rankingExpanded = {

    industry: false,

    theme: false

};


/* ==================================================
   日付を安全にDateへ変換
================================================== */

function parseDate(value) {

    if (!value) {
        return null;
    }

    const text =
        String(value);

    let date =
        new Date(
            text +
            (
                text.includes("T")
                    ? ""
                    : "T00:00:00"
            )
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        date =
            new Date(value);

    }

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return null;

    }

    return date;

}


/* ==================================================
   グラフ用日付表示
================================================== */

function formatChartDate(
    value,
    period
) {

    const date =
        parseDate(value);

    if (!date) {
        return String(value ?? "");
    }

    const month =
        date.getMonth() + 1;

    const day =
        date.getDate();

    /* --------------------------------
       5年 → 26/9
    -------------------------------- */

    if (
        period === "5y"
    ) {

        const year =
            String(
                date.getFullYear()
            ).slice(-2);

        return (
            year
            +
            "/"
            +
            month
        );

    }

    /* --------------------------------
       1月・半年 → 9/6
    -------------------------------- */

    return (
        month
        +
        "/"
        +
        day
    );

}


/* ==================================================
   赤▽＋グレー縦線
================================================== */

const boundaryPlugin = {

    id:
        "boundaryMarker",

    afterDraw(
        chart,
        args,
        options
    ) {

        if (
            !options ||
            !options.date
        ) {

            return;

        }

        const labels =
            chart.data.labels || [];

        if (
            !labels.length
        ) {

            return;

        }

        const targetDate =
            parseDate(
                options.date
            );

        if (!targetDate) {
            return;
        }

        const target =
            targetDate.getTime();

        let index = -1;

        let best =
            Infinity;


        labels.forEach(
            (
                label,
                i
            ) => {

                const date =
                    parseDate(label);

                if (!date) {
                    return;
                }

                const diff =
                    Math.abs(
                        date.getTime()
                        -
                        target
                    );

                if (
                    diff < best
                ) {

                    best = diff;

                    index = i;

                }

            }
        );


        if (
            index < 0
        ) {

            return;

        }


        const x =
            chart.scales.x
                .getPixelForValue(
                    index
                );


        const area =
            chart.chartArea;

        const ctx =
            chart.ctx;


        ctx.save();


        /* --------------------------------
           グレー縦線
        -------------------------------- */

        ctx.strokeStyle =
            "#999";

        ctx.lineWidth = 1;

        ctx.setLineDash([]);


        ctx.beginPath();

        ctx.moveTo(
            x,
            area.top
        );

        ctx.lineTo(
            x,
            area.bottom
        );

        ctx.stroke();


        /* --------------------------------
           赤い▽
        -------------------------------- */

        const y =
            area.top + 4;

        const size = 8;


        ctx.strokeStyle =
            "#d33";

        ctx.lineWidth = 2;

        ctx.lineJoin =
            "round";


        ctx.beginPath();

        ctx.moveTo(
            x - size,
            y
        );

        ctx.lineTo(
            x,
            y + size
        );

        ctx.lineTo(
            x + size,
            y
        );

        ctx.stroke();


        ctx.restore();

    }

};


Chart.register(
    boundaryPlugin
);


/* ==================================================
   履歴取得
================================================== */

function historyOf(
    stock,
    period,
    fixedTo1m = false
) {

    if (!stock) {
        return [];
    }

    const p =
        stock.periods || {};


    if (
        fixedTo1m &&
        period === "6m"
    ) {

        return (
            p.from_1m_6m &&
            p.from_1m_6m.history
        ) || [];

    }


    if (
        fixedTo1m &&
        period === "5y"
    ) {

        return (
            p.from_1m_5y &&
            p.from_1m_5y.history
        ) || [];

    }


    if (
        p[period] &&
        p[period].history
    ) {

        return p[period].history;

    }


    if (
        stock.history
    ) {

        return stock.history;

    }


    return [];

}


/* ==================================================
   グラフの最後の値から変化率
================================================== */

function changeFromHistory(
    history
) {

    if (
        !history ||
        !history.length
    ) {

        return null;

    }


    const last =
        Number(
            history[
                history.length - 1
            ].value
        );


    if (
        !Number.isFinite(last)
    ) {

        return null;

    }


    return last - 100;

}


/* ==================================================
   ランキング％表示
================================================== */

function rankingPercent(
    value
) {

    const n =
        Number(value);

    if (
        !Number.isFinite(n)
    ) {

        return null;

    }


    if (
        Math.abs(n) >= 1000
    ) {

        return n / 100;

    }


    return n;

}


/* ==================================================
   %表示
================================================== */

function formatPercent(
    value
) {

    const n =
        rankingPercent(
            value
        );

    if (n === null) {
        return "--";
    }


    return (
        n >= 0
            ? "+"
            : ""
    )
    +
    n.toFixed(2)
    +
    "%";

}


/* ==================================================
   業界・テーマ平均
================================================== */

function groupAverageChange(
    stocks,
    period
) {

    const values =
        (stocks || [])

        .map(
            stock =>
                changeFromHistory(
                    historyOf(
                        stock,
                        period
                    )
                )
        )

        .filter(
            value =>
                value !== null
        );


    if (
        !values.length
    ) {

        return null;

    }


    return (
        values.reduce(
            (
                a,
                b
            ) =>
                a + b,
            0
        )
        /
        values.length
    );

}


/* ==================================================
   業界・テーマ一覧
================================================== */

function groupList(
    dataset,
    type
) {

    const map =
        dataset[
            type === "industry"
                ? "industry_stocks"
                : "theme_stocks"
        ]
        || {};


    const key =
        type === "industry"
            ? "industry"
            : "theme";


    const names =
        Object.keys(map);


    return names

        .map(
            name => {

                const stocks =
                    map[name] || [];


                return {

                    [key]:
                        name,

                    stocks:
                        stocks,

                    change_percent:
                        groupAverageChange(
                            stocks,
                            selectedPeriod
                        )

                };

            }
        )

        .sort(
            (
                a,
                b
            ) =>
                (
                    b.change_percent ??
                    -Infinity
                )
                -
                (
                    a.change_percent ??
                    -Infinity
                )
        );

}


/* ==================================================
   グラフ作成
================================================== */

function createLineChart(
    canvas,
    datasets,
    labels,
    markerDate = null,
    period = "1m"
) {

    return new Chart(

        canvas.getContext(
            "2d"
        ),

        {

            type:
                "line",

            data: {

                labels:
                    labels,

                datasets:
                    datasets

            },

            options: {

                responsive:
                    true,

                maintainAspectRatio:
                    false,

                layout: {

                    padding: {

                        left: 0,

                        right: 4,

                        top: 2,

                        bottom: 0

                    }

                },

                interaction: {

                    mode:
                        "index",

                    intersect:
                        false

                },

                plugins: {

                    legend: {

                        display:
                            false

                    },

                    boundaryMarker: {

                        date:
                            markerDate

                    }

                },

                scales: {

                    y: {

                        title: {

                            display:
                                false

                        },

                        ticks: {

                            padding:
                                2

                        }

                    },

                    x: {

                        ticks: {

                            maxRotation:
                                0,

                            minRotation:
                                0,

                            autoSkip:
                                true,

                            maxTicksLimit:
                                8,

                            callback:
                                function(
                                    value,
                                    index
                                ) {

                                    const label =
                                        this.getLabelForValue(
                                            value
                                        );

                                    return formatChartDate(
                                        label,
                                        period
                                    );

                                }

                        }

                    }

                }

            }

        }

    );

}


/* ==================================================
   データセット作成
================================================== */

function makeDatasets(
    items,
    labelFunction,
    historyGetter
) {

    const allDates =
        new Set();


    const prepared =
        (items || [])

        .map(
            (
                item,
                index
            ) => {

                const history =
                    historyGetter(
                        item
                    );


                history.forEach(
                    point => {

                        if (
                            point &&
                            point.date
                        ) {

                            allDates.add(
                                point.date
                            );

                        }

                    }
                );


                return {

                    item:
                        item,

                    history:
                        history,

                    index:
                        index

                };

            }
        );


    const labels =
        Array.from(
            allDates
        )
        .sort(
            (
                a,
                b
            ) => {

                const da =
                    parseDate(a);

                const db =
                    parseDate(b);

                if (
                    !da ||
                    !db
                ) {

                    return 0;

                }

                return (
                    da.getTime()
                    -
                    db.getTime()
                );

            }
        );


    const datasets =
        prepared.map(
            ({
                item,
                history,
                index
            }) => {

                const map = {};


                history.forEach(
                    point => {

                        map[
                            point.date
                        ] =
                            point.value;

                    }
                );


                return {

                    label:
                        labelFunction(
                            item
                        ),

                    data:
                        labels.map(
                            date =>
                                map[date]
                                ??
                                null
                        ),

                    borderWidth:
                        2,

                    pointRadius:
                        0,

                    tension:
                        0.2,

                    spanGaps:
                        true,

                    borderColor:
                        chartColors[
                            index %
                            chartColors.length
                        ]

                };

            }
        );


    return {

        labels:
            labels,

        datasets:
            datasets

    };

}


/* ==================================================
   境界日を取得
================================================== */

function getMarkerDate(
    history,
    monthsBack
) {

    if (
        !history ||
        !history.length
    ) {

        return null;

    }


    const validDates =
        history

        .map(
            point =>
                parseDate(
                    point.date
                )
        )

        .filter(
            date =>
                date !== null
        );


    if (
        !validDates.length
    ) {

        return null;

    }


    const latest =
        new Date(
            Math.max(
                ...validDates.map(
                    d =>
                        d.getTime()
                )
            )
        );


    latest.setMonth(
        latest.getMonth()
        -
        monthsBack
    );


    const year =
        latest.getFullYear();


    const month =
        String(
            latest.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            latest.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year
        +
        "-"
        +
        month
        +
        "-"
        +
        day
    );

}


/* ==================================================
   TOP10
================================================== */

function topItems(
    dataset,
    type
) {

    const key =
        type === "industry"
            ? "industry"
            : "theme";


    const source =
        dataset[
            type === "industry"
                ? "top_industries"
                : "top_themes"
        ]
        || [];


    const groups =
        groupList(
            dataset,
            type
        );


    const byName =
        new Map(
            groups.map(
                item =>
                    [
                        item[key],
                        item
                    ]
            )
        );


    return source

        .map(
            item => {

                const group =
                    byName.get(
                        item[key]
                    );


                return group
                    ? {
                        ...item,
                        ...group
                    }
                    : item;

            }
        )

        .sort(
            (
                a,
                b
            ) =>
                (
                    b.change_percent ??
                    -Infinity
                )
                -
                (
                    a.change_percent ??
                    -Infinity
                )
        )

        .slice(
            0,
            10
        );

}


/* ==================================================
   業界・テーマ TOP10グラフ
================================================== */

function renderTopChart(
    type
) {

    const dataset =
        DATA[
            selectedPeriod
        ];


    const items =
        topItems(
            dataset,
            type
        );


    const canvas =
        document.getElementById(

            type === "industry"
                ? "industryChart"
                : "themeChart"

        );


    const legendId =
        type === "industry"
            ? "industryLegend"
            : "themeLegend";


    const key =
        type === "industry"
            ? "industry"
            : "theme";


    const prepared =
        makeDatasets(

            items,

            item =>
                item[key],

            item =>
                item.history || []

        );


    /* --------------------------------
       半年 → 1か月地点
       5年 → 6か月地点
    -------------------------------- */

    let markerMonths =
        null;


    if (
        selectedPeriod === "6m"
    ) {

        markerMonths = 1;

    }


    if (
        selectedPeriod === "5y"
    ) {

        markerMonths = 6;

    }


    const markerDate =
        markerMonths
            ? getMarkerDate(
                items[0]?.history ||
                [],
                markerMonths
            )
            : null;


    if (
        type === "industry"
    ) {

        if (
            industryChart
        ) {

            industryChart.destroy();

        }


        industryChart =
            createLineChart(

                canvas,

                prepared.datasets,

                prepared.labels,

                markerDate,

                selectedPeriod

            );

    }

    else {

        if (
            themeChart
        ) {

            themeChart.destroy();

        }


        themeChart =
            createLineChart(

                canvas,

                prepared.datasets,

                prepared.labels,

                markerDate,

                selectedPeriod

            );

    }


    createLegend(

        legendId,

        items,

        item =>
            item[key]

    );

}


/* ==================================================
   凡例
================================================== */

function createLegend(
    elementId,
    items,
    labelFunction
) {

    const container =
        document.getElementById(
            elementId
        );


    container.innerHTML =
        "";


    items.forEach(
        (
            item,
            index
        ) => {

            const div =
                document.createElement(
                    "span"
                );


            div.className =
                "legend-item";


            div.innerHTML = `

                <span
                    class="legend-line"
                    style="
                        background:
                        ${chartColors[
                            index %
                            chartColors.length
                        ]};
                    ">
                </span>

                ${escapeHtml(
                    labelFunction(
                        item
                    )
                )}

            `;


            container.appendChild(
                div
            );

        }
    );

}

/* ==================================================
   業界・テーマランキング共通
================================================== */

function renderGroupRanking(
    type
) {

    const dataset =
        DATA[
            selectedPeriod
        ];


    const container =
        document.getElementById(

            type === "industry"
                ? "industryRanking"
                : "themeRanking"

        );


    const mapKey =
        type === "industry"
            ? "industry_stocks"
            : "theme_stocks";


    const nameKey =
        type === "industry"
            ? "industry"
            : "theme";


    const groups =
        groupList(
            dataset,
            type
        );


    container.innerHTML =
        "";


    if (
        !groups.length
    ) {

        container.innerHTML =
            '<div class="no-data">データがありません</div>';

        return;

    }


    /* --------------------------------
       最初は10件
       展開時は全部
    -------------------------------- */

    const visibleGroups =
        rankingExpanded[type]
            ? groups
            : groups.slice(
                0,
                10
            );


    visibleGroups.forEach(
        (
            group,
            index
        ) => {

            const name =
                group[nameKey];


            const stocks =
                (
                    dataset[
                        mapKey
                    ] &&
                    dataset[
                        mapKey
                    ][name]
                )
                ||
                [];


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "ranking-row";


            /* --------------------------------
               ランキングボタン
            -------------------------------- */

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "ranking-button";


            const value =
                group.change_percent;


            button.innerHTML = `

                <span class="rank">
                    ${index + 1}
                </span>

                <span class="ranking-name">
                    ${escapeHtml(name)}
                </span>

                <span
                    class="
                        ranking-change
                        ${
                            value >= 0
                                ? "positive"
                                : "negative"
                        }
                    ">

                    ${formatPercent(
                        value
                    )}

                </span>

                <span class="arrow">
                    ▼
                </span>

            `;


            /* --------------------------------
               詳細
            -------------------------------- */

            const detail =
                document.createElement(
                    "div"
                );


            detail.className =
                "detail";


            detail.innerHTML = `

                <div class="detail-title">

                    ${escapeHtml(name)}
                    ${
                        type === "industry"
                            ? " の銘柄"
                            : " 関連銘柄"
                    }

                </div>


                <div
                    class="detail-period-bar">

                    <button
                        class="
                            detail-period-button
                            active
                        "
                        data-period="1m">

                        1月

                    </button>


                    <button
                        class="detail-period-button"
                        data-period="6m">

                        半年

                    </button>


                    <button
                        class="detail-period-button"
                        data-period="5y">

                        5年

                    </button>

                </div>


                <div class="detail-chart">

                    <canvas></canvas>

                </div>


                <div
                    class="detail-stock-ranking">
                </div>

            `;


            row.appendChild(
                button
            );

            row.appendChild(
                detail
            );

            container.appendChild(
                row
            );


            const stateKey =
                `${type}:${name}`;


            if (
                detailPeriods[
                    stateKey
                ] === undefined
            ) {

                detailPeriods[
                    stateKey
                ] = "1m";

            }


            const draw =
                () => {

                    const period =
                        detailPeriods[
                            stateKey
                        ];


                    detail
                        .querySelectorAll(
                            ".detail-period-button"
                        )
                        .forEach(
                            b => {

                                b.classList.toggle(

                                    "active",

                                    b.dataset.period
                                    ===
                                    period

                                );

                            }
                        );


                    renderGroupDetailChart(

                        type,

                        name,

                        stocks,

                        detail,

                        stateKey,

                        period

                    );


                    renderStockList(

                        detail.querySelector(
                            ".detail-stock-ranking"
                        ),

                        stocks,

                        period,

                        false

                    );

                };


            /* --------------------------------
               詳細期間ボタン
            -------------------------------- */

            detail
                .querySelectorAll(
                    ".detail-period-button"
                )
                .forEach(
                    b => {

                        b.addEventListener(
                            "click",
                            e => {

                                e.stopPropagation();


                                detailPeriods[
                                    stateKey
                                ] =
                                    b.dataset.period;


                                draw();

                            }
                        );

                    }
                );


            /* --------------------------------
               ランキングクリック
            -------------------------------- */

            button.addEventListener(
                "click",
                () => {

                    const open =
                        detail.classList.contains(
                            "open"
                        );


                    const rankingId =
                        type === "industry"
                            ? "industryRanking"
                            : "themeRanking";


                    document
                        .querySelectorAll(
                            `#${rankingId} .detail.open`
                        )
                        .forEach(
                            d =>
                                d.classList.remove(
                                    "open"
                                )
                        );


                    document
                        .querySelectorAll(
                            `#${rankingId} .arrow`
                        )
                        .forEach(
                            arrow =>
                                arrow.textContent =
                                    "▼"
                        );


                    if (!open) {

                        detail.classList.add(
                            "open"
                        );


                        button
                            .querySelector(
                                ".arrow"
                            )
                            .textContent =
                                "▲";


                        draw();

                    }

                }
            );

        }
    );


    /* ==================================================
       10位の下に▽
    ================================================== */

    if (
        groups.length > 10
    ) {

        const expandButton =
            document.createElement(
                "button"
            );


        expandButton.className =
            "ranking-expand-button";


        expandButton.textContent =
            rankingExpanded[type]
                ? "△"
                : "▽";


        expandButton.title =
            rankingExpanded[type]
                ? "TOP10に戻す"
                : "すべて表示";


        expandButton.addEventListener(
            "click",
            () => {

                rankingExpanded[type] =
                    !rankingExpanded[type];


                renderGroupRanking(
                    type
                );

            }
        );


        container.appendChild(
            expandButton
        );

    }

}


/* ==================================================
   詳細グラフの履歴
================================================== */

function getDetailHistory(
    stock,
    period
) {

    return historyOf(
        stock,
        period,
        true
    );

}


/* ==================================================
   業界・テーマ詳細グラフ
================================================== */

function renderGroupDetailChart(
    type,
    name,
    stocks,
    detail,
    stateKey,
    period
) {

    const canvas =
        detail.querySelector(
            "canvas"
        );


    const prepared =
        makeDatasets(

            stocks,

            stock =>
                `${stock.code} ${stock.name}`,

            stock =>
                getDetailHistory(
                    stock,
                    period
                )

        );


    let markerMonths =
        null;


    if (
        period === "6m"
    ) {

        markerMonths = 1;

    }


    if (
        period === "5y"
    ) {

        markerMonths = 6;

    }


    const markerDate =
        markerMonths
            ? getMarkerDate(

                stocks[0]
                    ? getDetailHistory(
                        stocks[0],
                        period
                    )
                    : [],

                markerMonths

            )
            : null;


    if (
        detailCharts[
            stateKey
        ]
    ) {

        detailCharts[
            stateKey
        ].destroy();

    }


    if (
        !prepared.labels.length
    ) {

        canvas.parentElement.innerHTML =
            '<div class="no-data">グラフデータがありません</div>';

        return;

    }


    detailCharts[
        stateKey
    ] =
        createLineChart(

            canvas,

            prepared.datasets,

            prepared.labels,

            markerDate,

            period

        );

}


/* ==================================================
   銘柄ランキング
================================================== */

function renderStockList(
    container,
    stocks,
    period,
    expandable = true
) {

    container.innerHTML =
        "";


    const sorted =
        [...stocks]

        .sort(
            (
                a,
                b
            ) => {

                const av =
                    changeFromHistory(
                        historyOf(
                            a,
                            period
                        )
                    );


                const bv =
                    changeFromHistory(
                        historyOf(
                            b,
                            period
                        )
                    );


                return (
                    bv ??
                    -Infinity
                )
                -
                (
                    av ??
                    -Infinity
                );

            }
        );


    if (
        !sorted.length
    ) {

        container.innerHTML =
            '<div class="no-data">銘柄データがありません</div>';

        return;

    }


    sorted.forEach(
        (
            stock,
            index
        ) => {

            const value =
                changeFromHistory(
                    historyOf(
                        stock,
                        period
                    )
                );


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "stock-row"
                +
                (
                    expandable
                        ? " clickable"
                        : ""
                );


            row.innerHTML = `

                <span class="stock-rank">
                    ${index + 1}
                </span>

                <span class="stock-code">
                    ${escapeHtml(
                        stock.code
                    )}
                </span>

                <span class="stock-name">
                    ${escapeHtml(
                        stock.name
                    )}
                </span>

                <span
                    class="
                        stock-change
                        ${
                            value >= 0
                                ? "positive"
                                : "negative"
                        }
                    ">

                    ${formatPercent(
                        value
                    )}

                </span>

                ${
                    expandable
                        ? '<span class="stock-arrow">▼</span>'
                        : ''
                }

            `;


            container.appendChild(
                row
            );


            if (
                expandable
            ) {

                const detail =
                    document.createElement(
                        "div"
                    );


                detail.className =
                    "stock-detail";


                detail.innerHTML = `

                    <div
                        class="detail-period-bar">

                        <button
                            class="
                                detail-period-button
                                ${
                                    period === "1m"
                                        ? "active"
                                        : ""
                                }
                            "
                            data-period="1m">

                            1月

                        </button>


                        <button
                            class="
                                detail-period-button
                                ${
                                    period === "6m"
                                        ? "active"
                                        : ""
                                }
                            "
                            data-period="6m">

                            半年

                        </button>


                        <button
                            class="
                                detail-period-button
                                ${
                                    period === "5y"
                                        ? "active"
                                        : ""
                                }
                            "
                            data-period="5y">

                            5年

                        </button>

                    </div>


                    <div
                        class="detail-chart">

                        <canvas></canvas>

                    </div>

                `;


                container.appendChild(
                    detail
                );


                let currentPeriod =
                    period;


                const key =
                    `stock:${stock.code}:${Math.random()}`;


                const draw =
                    () => {

                        detail
                            .querySelectorAll(
                                ".detail-period-button"
                            )
                            .forEach(
                                b => {

                                    b.classList.toggle(

                                        "active",

                                        b.dataset.period
                                        ===
                                        currentPeriod

                                    );

                                }
                            );


                        const prepared =
                            makeDatasets(

                                [stock],

                                s =>
                                    `${s.code} ${s.name}`,

                                s =>
                                    historyOf(
                                        s,
                                        currentPeriod,
                                        true
                                    )

                            );


                        let markerDate =
                            null;


                        if (
                            currentPeriod ===
                            "6m"
                        ) {

                            markerDate =
                                getMarkerDate(

                                    historyOf(
                                        stock,
                                        currentPeriod,
                                        true
                                    ),

                                    1

                                );

                        }


                        if (
                            currentPeriod ===
                            "5y"
                        ) {

                            markerDate =
                                getMarkerDate(

                                    historyOf(
                                        stock,
                                        currentPeriod,
                                        true
                                    ),

                                    6

                                );

                        }


                        if (
                            detailCharts[key]
                        ) {

                            detailCharts[
                                key
                            ].destroy();

                        }


                        const canvas =
                            detail.querySelector(
                                "canvas"
                            );


                        if (
                            !prepared.labels.length
                        ) {

                            canvas
                                .parentElement
                                .innerHTML =
                                '<div class="no-data">グラフデータがありません</div>';

                            return;

                        }


                        detailCharts[key] =
                            createLineChart(

                                canvas,

                                prepared.datasets,

                                prepared.labels,

                                markerDate,

                                currentPeriod

                            );

                    };


                row.addEventListener(
                    "click",
                    () => {

                        const open =
                            detail.classList.contains(
                                "open"
                            );


                        detail.classList.toggle(
                            "open",
                            !open
                        );


                        row
                            .querySelector(
                                ".stock-arrow"
                            )
                            .textContent =
                                open
                                    ? "▼"
                                    : "▲";


                        if (!open) {
                            draw();
                        }

                    }
                );


                detail
                    .querySelectorAll(
                        ".detail-period-button"
                    )
                    .forEach(
                        b => {

                            b.addEventListener(
                                "click",
                                e => {

                                    e.stopPropagation();


                                    currentPeriod =
                                        b.dataset.period;


                                    draw();

                                }
                            );

                        }
                    );

            }

        }
    );

}


/* ==================================================
   値上がり銘柄TOP10
================================================== */

function renderGainers() {

    const dataset =
        DATA[
            selectedPeriod
        ];


    const container =
        document.getElementById(
            "stockRanking"
        );


    const title =
        document.getElementById(
            "gainerTitle"
        );


    title.textContent =
        `${periodLabel(
            selectedPeriod
        )} 値上がり銘柄 TOP10`;


    container.innerHTML =
        "";


    const stocks =
        dataset.top_gainers
        || [];


    if (
        !stocks.length
    ) {

        container.innerHTML =
            '<div class="no-data">銘柄データがありません</div>';

        return;

    }


    renderStockList(

        container,

        stocks,

        selectedPeriod,

        true

    );

}


/* ==================================================
   期間名
================================================== */

function periodLabel(
    period
) {

    if (
        period === "1m"
    ) {

        return "1か月";

    }


    if (
        period === "6m"
    ) {

        return "半年";

    }


    return "5年";

}


/* ==================================================
   ページ全体を再描画
================================================== */

function renderAll() {

    document
        .querySelectorAll(
            "#globalPeriodBar .period-button"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "active",

                    button.dataset.period
                    ===
                    selectedPeriod

                );

            }
        );


    renderTopChart(
        "industry"
    );

    renderGroupRanking(
        "industry"
    );


    renderTopChart(
        "theme"
    );

    renderGroupRanking(
        "theme"
    );


    renderGainers();

}


/* ==================================================
   一番上の期間ボタン
================================================== */

function setupGlobalPeriodButtons() {

    document
        .querySelectorAll(
            "#globalPeriodBar .period-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const next =
                            button.dataset.period;


                        if (
                            next ===
                            selectedPeriod
                        ) {

                            return;

                        }


                        const scrollY =
                            window.scrollY
                            ||
                            window.pageYOffset
                            ||
                            0;


                        selectedPeriod =
                            next;


                        /*
                           期間を変えたら
                           ランキングの展開状態は
                           TOP10に戻す
                        */

                        rankingExpanded.industry =
                            false;

                        rankingExpanded.theme =
                            false;


                        renderAll();


                        requestAnimationFrame(
                            () => {

                                requestAnimationFrame(
                                    () => {

                                        window.scrollTo(
                                            0,
                                            scrollY
                                        );

                                    }
                                );

                            }
                        );

                    }
                );

            }
        );

}


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==================================================
   data.json取得
================================================== */

fetch(
    "data.json",
    {
        cache:
            "no-store"
    }
)

.then(
    response => {

        if (
            !response.ok
        ) {

            throw new Error(
                "data.json の取得に失敗しました"
            );

        }


        return response.json();

    }
)

.then(
    data => {

        DATA =
            data;


        document
            .getElementById(
                "updated"
            )
            .textContent =
            "最終更新: "
            +
            data.updated_at;


        setupGlobalPeriodButtons();


        renderAll();

    }
)

.catch(
    error => {

        console.error(
            error
        );


        document
            .getElementById(
                "updated"
            )
            .textContent =
            "データ取得エラー";

    }
);


</script>
