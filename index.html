<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>日本株モニター</title>

  <style>

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      margin: 0;
      padding: 16px;

      background: #f5f5f7;

      color: #222;
    }


    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }


    .updated {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }


    .card {

      background: white;

      border-radius: 14px;

      padding: 16px;

      margin-bottom: 16px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

    }


    h2 {

      font-size: 18px;

      margin-top: 0;

      margin-bottom: 12px;

    }


    .row {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 10px 0;

      border-bottom:
        1px solid #eee;

    }


    .row:last-child {

      border-bottom: none;

    }


    .name {

      font-weight: 600;

    }


    .code {

      font-size: 12px;

      color: #888;

    }


    .up {

      color: #d33;

      font-weight: 700;

    }


    .down {

      color: #1677d2;

      font-weight: 700;

    }


    .flat {

      color: #666;

      font-weight: 700;

    }


    .loading {

      text-align: center;

      padding: 40px;

      color: #777;

    }

  </style>

</head>


<body>


  <h1>📊 日本株モニター</h1>

  <div
    class="updated"
    id="updated"
  >
    読み込み中...
  </div>


  <div id="content">

    <div class="loading">

      データを読み込んでいます...

    </div>

  </div>



  <script>

    function percentClass(value) {

      if (value > 0) {

        return "up";

      }

      if (value < 0) {

        return "down";

      }

      return "flat";

    }



    function formatPercent(value) {

      const sign =
        value > 0
          ? "+"
          : "";

      return (
        sign
        +
        value.toFixed(2)
        +
        "%"
      );

    }



    fetch("data.json")

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "data.jsonを取得できません"
          );

        }

        return response.json();

      })

      .then(data => {

        document
          .getElementById("updated")
          .textContent =
          "最終更新: "
          +
          data.updated_at;


        const content =
          document.getElementById(
            "content"
          );


        let html = "";


        /*
        =====================
        業界ランキング
        =====================
        */

        html += `

          <div class="card">

            <h2>
              📈 業界ランキング
            </h2>

        `;


        data.industries.forEach(
          (item, index) => {

            const rank =
              index + 1;


            html += `

              <div class="row">

                <div>

                  <div class="name">

                    ${rank}.
                    ${item.industry}

                  </div>

                </div>


                <div
                  class="${percentClass(
                    item.change_percent
                  )}"
                >

                  ${formatPercent(
                    item.change_percent
                  )}

                </div>

              </div>

            `;

          }
        );


        html += `

          </div>

        `;


        /*
        =====================
        上昇銘柄
        =====================
        */

        html += `

          <div class="card">

            <h2>
              🔥 上昇銘柄 TOP10
            </h2>

        `;


        data.top_gainers.forEach(
          item => {

            html += `

              <div class="row">

                <div>

                  <div class="name">

                    ${item.name}

                  </div>


                  <div class="code">

                    ${item.code}

                    ・

                    ${item.industry}

                  </div>

                </div>


                <div
                  class="${percentClass(
                    item.change_percent
                  )}"
                >

                  ${formatPercent(
                    item.change_percent
                  )}

                </div>

              </div>

            `;

          }
        );


        html += `

          </div>

        `;


        /*
        =====================
        下落銘柄
        =====================
        */

        html += `

          <div class="card">

            <h2>
              🔻 下落銘柄 TOP10
            </h2>

        `;


        data.top_losers.forEach(
          item => {

            html += `

              <div class="row">

                <div>

                  <div class="name">

                    ${item.name}

                  </div>


                  <div class="code">

                    ${item.code}

                    ・

                    ${item.industry}

                  </div>

                </div>


                <div
                  class="${percentClass(
                    item.change_percent
                  )}"
                >

                  ${formatPercent(
                    item.change_percent
                  )}

                </div>

              </div>

            `;

          }
        );


        html += `

          </div>

        `;


        content.innerHTML = html;

      })


      .catch(error => {

        document
          .getElementById("content")
          .innerHTML = `

            <div class="loading">

              データの読み込みに失敗しました

            </div>

          `;


        console.error(error);

      });

  </script>


</body>

</html>
