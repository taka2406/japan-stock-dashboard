<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>日本株ダッシュボード</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    margin: 0;

    background: #f5f5f5;

    color: #222;
}

.container {
    max-width: 700px;

    margin: auto;

    padding: 16px;
}

h1 {
    font-size: 24px;

    margin:
        8px
        0
        6px;
}

.updated {
    color: #777;

    font-size: 13px;

    margin-bottom: 20px;
}

.card {
    background: white;

    border-radius: 14px;

    padding: 16px;

    margin-bottom: 18px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.06);
}

h2 {
    font-size: 18px;

    margin:
        0
        0
        14px;
}

.chart-container {
    position: relative;

    width: 100%;

    height: 330px;
}

.detail-chart {
    position: relative;

    width: 100%;

    height: 280px;

    margin-bottom: 14px;
}

canvas {
    max-width: 100%;
}

.legend {
    margin-top: 12px;

    font-size: 12px;

    line-height: 1.8;
}

.legend-item {
    display: inline-block;

    margin-right: 10px;
}

.legend-line {
    display: inline-block;

    width: 18px;

    height: 3px;

    margin-right: 4px;

    vertical-align: middle;
}


/* =========================
   ランキング共通
========================= */

.ranking-row {
    border-bottom: 1px solid #eee;
}

.ranking-button {
    width: 100%;

    border: none;

    background: white;

    padding: 14px 4px;

    display: flex;

    align-items: center;

    text-align: left;

    font-size: 15px;

    cursor: pointer;
}

.ranking-button:active {
    background: #f5f5f5;
}

.rank {
    width: 32px;

    font-weight: bold;

    color: #777;
}

.ranking-name {
    flex: 1;

    font-weight: 600;
}

.ranking-change {
    font-weight: bold;

    margin-right: 8px;
}

.arrow {
    width: 20px;

    text-align: center;

    color: #888;

    font-size: 13px;
}


/* =========================
   詳細
========================= */

.detail {
    display: none;

    padding:
        4px
        4px
        18px
        36px;

    background: #fafafa;
}

.detail.open {
    display: block;
}

.detail-title {
    font-size: 15px;

    font-weight: bold;

    margin:
        8px
        0
        12px;
}


/* =========================
   銘柄ランキング
========================= */

.stock-row {
    display: flex;

    align-items: center;

    padding: 9px 0;

    border-bottom: 1px solid #eee;

    font-size: 13px;
}

.stock-rank {
    width: 28px;

    color: #777;
}

.stock-code {
    width: 52px;

    color: #888;

    font-size: 11px;
}

.stock-name {
    flex: 1;

    font-weight: 500;
}

.stock-change {
    font-weight: bold;
}

.positive {
    color: #d33;
}

.negative {
    color: #1670c5;
}

.no-data {
    color: #888;

    font-size: 13px;

    padding: 10px 0;
}


/* =========================
   テーマ見出し
========================= */

.theme-heading {
    display: flex;

    align-items: center;

    gap: 6px;
}

.fire {
    font-size: 18px;
}


/* =========================
   スマホ調整
========================= */

@media (max-width: 500px) {

    .container {
        padding: 12px;
    }

    .card {
        padding: 14px;
    }

    .chart-container {
        height: 300px;
    }

    .detail-chart {
        height: 250px;
    }

    .detail {
        padding-left: 24px;
    }

    .ranking-button {
        padding:
            13px
            2px;
    }

    .ranking-name {
        font-size: 14px;
    }

}

</style>

</head>


<body>

<div class="container">

<h1>
    日本株ダッシュボード
</h1>

<div
    class="updated"
    id="updated">
    読み込み中...
</div>


<!-- ==================================================
     1. 業界 TOP10
================================================== -->

<div class="card">

<h2>
    業界 TOP10
</h2>

<div class="chart-container">

<canvas id="industryChart"></canvas>

</div>

<div
    id="industryLegend"
    class="legend">
</div>

</div>


<!-- ==================================================
     2. 業界ランキング
================================================== -->

<div class="card">

<h2>
    業界ランキング
</h2>

<div id="industryRanking"></div>

</div>


<!-- ==================================================
     3. テーマ TOP10
================================================== -->

<div class="card">

<h2 class="theme-heading">
    <span class="fire">🔥</span>
    テーマ TOP10
</h2>

<div class="chart-container">

<canvas id="themeChart"></canvas>

</div>

<div
    id="themeLegend"
    class="legend">
</div>

</div>


<!-- ==================================================
     4. テーマランキング
================================================== -->

<div class="card">

<h2 class="theme-heading">
    <span class="fire">🔥</span>
    テーマランキング
</h2>

<div id="themeRanking"></div>

</div>


<!-- ==================================================
     5. 1か月値上がり銘柄 TOP10
================================================== -->

<div class="card">

<h2>
    1か月値上がり銘柄 TOP10
</h2>

<div class="chart-container">

<canvas id="stockChart"></canvas>

</div>

<div
    id="stockLegend"
    class="legend">
</div>

</div>


</div>


<script>


/* ==================================================
   グローバル
================================================== */

let industryChart = null;

let themeChart = null;

let stockChart = null;

let detailCharts = {};


/* ==================================================
   データ取得
================================================== */

fetch(
    "data.json",
    {
        cache: "no-store"
    }
)

.then(response => {

    if (!response.ok) {
        throw new Error(
            "data.json の取得に失敗しました"
        );
    }

    return response.json();

})

.then(data => {

    document.getElementById(
        "updated"
    ).textContent =
        "最終更新: "
        + data.updated_at;


    /* --------------------------------
       業界 TOP10
    -------------------------------- */

    createIndustryChart(
        data.top_industries || []
    );


    /* --------------------------------
       業界ランキング
    -------------------------------- */

    createIndustryRanking(
        data.industries || [],
        data.industry_stocks || {}
    );


    /* --------------------------------
       テーマ TOP10
    -------------------------------- */

    createThemeChart(
        data.top_themes || []
    );


    /* --------------------------------
       テーマランキング
    -------------------------------- */

    createThemeRanking(
        data.themes || [],
        data.theme_stocks || {}
    );


    /* --------------------------------
       値上がりTOP10
    -------------------------------- */

    createStockChart(
        data.top_gainers || []
    );

})

.catch(error => {

    console.error(error);

    document.getElementById(
        "updated"
    ).textContent =
        "データ取得エラー";

});


/* ==================================================
   共通：グラフ設定
================================================== */

function createLineChart(
    canvas,
    datasets,
    labels
) {

    return new Chart(
        canvas.getContext("2d"),
        {

            type: "line",

            data: {

                labels: labels,

                datasets: datasets

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                interaction: {

                    mode: "index",

                    intersect: false

                },

                plugins: {

                    legend: {

                        display: false

                    }

                },

                scales: {

                    y: {

                        title: {

                            display: true,

                            text:
                                "1か月前 = 100"

                        }

                    }

                }

            }

        }
    );

}


/* ==================================================
   共通：データセット作成
================================================== */

function makeDatasets(
    items,
    labelFunction
) {

    return items.map(
        (item, index) => {

            return {

                label:
                    labelFunction(item),

                data:
                    (item.history || []).map(
                        point => point.value
                    ),

                borderWidth: 2,

                pointRadius: 0,

                tension: 0.2,

                borderColor:
                    `hsl(${index * 37 % 360}, 70%, 50%)`

            };

        }
    );

}


/* ==================================================
   1. 業界 TOP10
================================================== */

function createIndustryChart(
    industries
) {

    const canvas =
        document.getElementById(
            "industryChart"
        );

    if (!canvas) {
        return;
    }


    const labels =
        industries.length > 0
        ? industries[0].history.map(
            item => item.date
        )
        : [];


    const datasets =
        makeDatasets(
            industries,
            industry =>
                industry.industry
        );


    if (industryChart) {

        industryChart.destroy();

    }


    industryChart =
        createLineChart(
            canvas,
            datasets,
            labels
        );


    createLegend(
        "industryLegend",
        industries,
        item =>
            item.industry
    );

}


/* ==================================================
   2. 業界ランキング
================================================== */

function createIndustryRanking(
    industries,
    industryStocks
) {

    const container =
        document.getElementById(
            "industryRanking"
        );


    container.innerHTML = "";


    if (!industries.length) {

        container.innerHTML =
            '<div class="no-data">業界データがありません</div>';

        return;

    }


    industries.forEach(
        (industry, index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "ranking-row";


            /* --------------------------------
               ボタン
            -------------------------------- */

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "ranking-button";


            const changeClass =
                industry.change_percent >= 0
                ? "positive"
                : "negative";


            button.innerHTML = `

                <span class="rank">
                    ${index + 1}
                </span>

                <span class="ranking-name">
                    ${escapeHtml(
                        industry.industry
                    )}
                </span>

                <span class="ranking-change ${changeClass}">
                    ${formatPercent(
                        industry.change_percent
                    )}
                </span>

                <span class="arrow">
                    ▼
                </span>

            `;


            /* --------------------------------
               詳細
            -------------------------------- */

            const detail =
                document.createElement(
                    "div"
                );

            detail.className =
                "detail";


            const stocks =
                industryStocks[
                    industry.industry
                ] || [];


            detail.innerHTML = `

                <div class="detail-title">
                    ${escapeHtml(
                        industry.industry
                    )} の銘柄
                </div>

                <div class="detail-chart">

                    <canvas
                        id="industry-chart-${index}">
                    </canvas>

                </div>

                <div id="industry-stocks-${index}">
                </div>

            `;


            row.appendChild(button);

            row.appendChild(detail);

            container.appendChild(row);


            /* --------------------------------
               クリック
            -------------------------------- */

            button.addEventListener(
                "click",
                function() {

                    const isOpen =
                        detail.classList.contains(
                            "open"
                        );


                    /* 閉じる */

                    if (isOpen) {

                        detail.classList.remove(
                            "open"
                        );

                        button
                            .querySelector(
                                ".arrow"
                            )
                            .textContent =
                                "▼";

                        return;

                    }


                    /* 他の業界を閉じる */

                    document
                        .querySelectorAll(
                            "#industryRanking .detail.open"
                        )
                        .forEach(
                            other => {

                                other.classList.remove(
                                    "open"
                                );

                            }
                        );


                    document
                        .querySelectorAll(
                            "#industryRanking .arrow"
                        )
                        .forEach(
                            arrow => {

                                arrow.textContent =
                                    "▼";

                            }
                        );


                    /* 開く */

                    detail.classList.add(
                        "open"
                    );

                    button
                        .querySelector(
                            ".arrow"
                        )
                        .textContent =
                            "▲";


                    createIndustryDetail(
                        index,
                        stocks
                    );

                }

            );

        }

    );

}


/* ==================================================
   業界詳細
================================================== */

function createIndustryDetail(
    index,
    stocks
) {

    const stockContainer =
        document.getElementById(
            `industry-stocks-${index}`
        );


    stockContainer.innerHTML = "";


    if (!stocks.length) {

        stockContainer.innerHTML =
            '<div class="no-data">銘柄データがありません</div>';

        return;

    }


    /* --------------------------------
       銘柄ランキング
    -------------------------------- */

    stocks.forEach(
        (stock, stockIndex) => {

            const changeClass =
                stock.change_percent >= 0
                ? "positive"
                : "negative";


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "stock-row";


            row.innerHTML = `

                <span class="stock-rank">
                    ${stockIndex + 1}
                </span>

                <span class="stock-code">
                    ${escapeHtml(
                        stock.code
                    )}
                </span>

                <span class="stock-name">
                    ${escapeHtml(
                        stock.name
                    )}
                </span>

                <span class="stock-change ${changeClass}">
                    ${formatPercent(
                        stock.change_percent
                    )}
                </span>

            `;


            stockContainer.appendChild(
                row
            );

        }
    );


    /* --------------------------------
       業界銘柄グラフ
    -------------------------------- */

    const canvas =
        document.getElementById(
            `industry-chart-${index}`
        );


    if (!canvas) {
        return;
    }


    const labels =
        stocks[0].history
            ? stocks[0].history.map(
                item => item.date
            )
            : [];


    const datasets =
        makeDatasets(
            stocks,
            stock =>
                stock.code
                + " "
                + stock.name
        );


    const chartKey =
        "industry-" + index;


    if (detailCharts[chartKey]) {

        detailCharts[chartKey].destroy();

    }


    detailCharts[chartKey] =
        createLineChart(
            canvas,
            datasets,
            labels
        );

}


/* ==================================================
   3. テーマ TOP10
================================================== */

function createThemeChart(
    themes
) {

    const canvas =
        document.getElementById(
            "themeChart"
        );

    if (!canvas) {
        return;
    }


    const labels =
        themes.length > 0
        ? themes[0].history.map(
            item => item.date
        )
        : [];


    const datasets =
        makeDatasets(
            themes,
            theme =>
                theme.theme
        );


    if (themeChart) {

        themeChart.destroy();

    }


    themeChart =
        createLineChart(
            canvas,
            datasets,
            labels
        );


    createLegend(
        "themeLegend",
        themes,
        item =>
            item.theme
    );

}


/* ==================================================
   4. テーマランキング
================================================== */

function createThemeRanking(
    themes,
    themeStocks
) {

    const container =
        document.getElementById(
            "themeRanking"
        );


    container.innerHTML = "";


    if (!themes.length) {

        container.innerHTML =
            '<div class="no-data">テーマデータがありません</div>';

        return;

    }


    themes.forEach(
        (theme, index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "ranking-row";


            /* --------------------------------
               ボタン
            -------------------------------- */

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "ranking-button";


            const changeClass =
                theme.change_percent >= 0
                ? "positive"
                : "negative";


            button.innerHTML = `

                <span class="rank">
                    ${index + 1}
                </span>

                <span class="ranking-name">
                    ${escapeHtml(

                    )}
                </span>

                <span class="ranking-change ${changeClass}">
                    ${formatPercent(
                        theme.change_percent
                    )}
                </span>

                <span class="arrow">
                    ▼
                </span>

            `;


            /* --------------------------------
               詳細
            -------------------------------- */

            const detail =
                document.createElement(
                    "div"
                );

            detail.className =
                "detail";


            const stocks =
                themeStocks[
                    theme.theme
                ] || [];


            detail.innerHTML = `

                <div class="detail-title">
                    ${escapeHtml(
                        theme.theme
                    )}
                    関連銘柄
                </div>

                <div class="detail-chart">

                    <canvas
                        id="theme-chart-${index}">
                    </canvas>

                </div>

                <div id="theme-stocks-${index}">
                </div>

            `;


            row.appendChild(button);

            row.appendChild(detail);

            container.appendChild(row);


            /* --------------------------------
               クリック
            -------------------------------- */

            button.addEventListener(
                "click",
                function() {

                    const isOpen =
                        detail.classList.contains(
                            "open"
                        );


                    /* 閉じる */

                    if (isOpen) {

                        detail.classList.remove(
                            "open"
                        );

                        button
                            .querySelector(
                                ".arrow"
                            )
                            .textContent =
                                "▼";

                        return;

                    }


                    /* 他のテーマを閉じる */

                    document
                        .querySelectorAll(
                            "#themeRanking .detail.open"
                        )
                        .forEach(
                            other => {

                                other.classList.remove(
                                    "open"
                                );

                            }
                        );


                    document
                        .querySelectorAll(
                            "#themeRanking .arrow"
                        )
                        .forEach(
                            arrow => {

                                arrow.textContent =
                                    "▼";

                            }
                        );


                    /* 開く */

                    detail.classList.add(
                        "open"
                    );

                    button
                        .querySelector(
                            ".arrow"
                        )
                        .textContent =
                            "▲";


                    createThemeDetail(
                        index,
                        stocks
                    );

                }

            );

        }

    );

}


/* ==================================================
   テーマ詳細
================================================== */

function createThemeDetail(
    index,
    stocks
) {

    const stockContainer =
        document.getElementById(
            `theme-stocks-${index}`
        );


    stockContainer.innerHTML = "";


    if (!stocks.length) {

        stockContainer.innerHTML =
            '<div class="no-data">このテーマの銘柄データがありません</div>';

        return;

    }


    /* --------------------------------
       テーマ銘柄ランキング
    -------------------------------- */

    stocks.forEach(
        (stock, stockIndex) => {

            const changeClass =
                stock.change_percent >= 0
                ? "positive"
                : "negative";


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "stock-row";


            row.innerHTML = `

                <span class="stock-rank">
                    ${stockIndex + 1}
                </span>

                <span class="stock-code">
                    ${escapeHtml(
                        stock.code
                    )}
                </span>

                <span class="stock-name">
                    ${escapeHtml(
                        stock.name
                    )}
                </span>

                <span class="stock-change ${changeClass}">
                    ${formatPercent(
                        stock.change_percent
                    )}
                </span>

            `;


            stockContainer.appendChild(
                row
            );

        }
    );


    /* --------------------------------
       テーマ銘柄グラフ
    -------------------------------- */

    const canvas =
        document.getElementById(
            `theme-chart-${index}`
        );


    if (!canvas) {
        return;
    }


    const labels =
        stocks[0].history
            ? stocks[0].history.map(
                item => item.date
            )
            : [];


    const datasets =
        makeDatasets(
            stocks,
            stock =>
                stock.code
                + " "
                + stock.name
        );


    const chartKey =
        "theme-" + index;


    if (detailCharts[chartKey]) {

        detailCharts[chartKey].destroy();

    }


    detailCharts[chartKey] =
        createLineChart(
            canvas,
            datasets,
            labels
        );

}


/* ==================================================
   5. 値上がり銘柄 TOP10
================================================== */

function createStockChart(
    stocks
) {

    const canvas =
        document.getElementById(
            "stockChart"
        );

    if (!canvas) {
        return;
    }


    const labels =
        stocks.length > 0
        ? stocks[0].history.map(
            item => item.date
        )
        : [];


    const datasets =
        makeDatasets(
            stocks,
            stock =>
                stock.code
                + " "
                + stock.name
        );


    if (stockChart) {

        stockChart.destroy();

    }


    stockChart =
        createLineChart(
            canvas,
            datasets,
            labels
        );


    createLegend(
        "stockLegend",
        stocks,
        item =>
            item.code
            + " "
            + item.name
    );

}


/* ==================================================
   凡例
================================================== */

function createLegend(
    elementId,
    items,
    labelFunction
) {

    const container =
        document.getElementById(
            elementId
        );


    if (!container) {
        return;
    }


    container.innerHTML = "";


    items.forEach(
        (item, index) => {

            const div =
                document.createElement(
                    "span"
                );


            div.className =
                "legend-item";


            div.innerHTML = `

                <span
                    class="legend-line"
                    style="
                        background:
                        hsl(
                            ${index * 37 % 360},
                            70%,
                            50%
                        );
                    ">
                </span>

                ${escapeHtml(
                    labelFunction(item)
                )}

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* ==================================================
   %表示
================================================== */

function formatPercent(
    value
) {

    const number =
        Number(value);


    const sign =
        number >= 0
        ? "+"
        : "";


    return (
        sign
        + number.toFixed(2)
        + "%"
    );

}


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHtml(
    value
) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
