  <!--
    ★ 業界・テーマ全体を見る期間

    1月   → 1か月前 = 100
    半年   → 6か月前 = 100
    5年   → 5年前 = 100

    この期間は
    業界TOP10
    業界ランキング
    テーマTOP10
    テーマランキング
    に共通して使う。
  -->

  <div
    id="global-period-buttons"

  </div>

<script>

/* ============================================================
   基本設定
============================================================ */

let DATA = null;


/*
  現在の全体期間

  1m:
    1か月前 = 100

  6m:
    6か月前 = 100

  5y:
    5年前 = 100
*/

let GLOBAL_PERIOD = "1m";


/*
  個別グラフの期間

  detail-xxx
  stock-xxx
  などを保存
*/

const chartPeriods = {};


const PERIOD_LABEL = {

  "1m": "1月",

  "6m": "半年",

  "5y": "5年"

};


const PERIOD_ORDER = [

  "1m",
  "6m",
  "5y"

];


/* ============================================================
   表示用関数
============================================================ */

function formatPercent(value) {

  if (
    value === null ||
    value === undefined ||
    Number.isNaN(Number(value))
  ) {

    return "-";

  }


  const n =
    Number(value) * 100;


  const sign =
    n > 0 ? "+" : "";


  return (
    sign +
    n.toFixed(1) +
    "%"
  );

}


function changeClass(value) {

  return Number(value) >= 0
    ? "up"
    : "down";

}


/* ============================================================
   数値取得
============================================================ */

function safeNumber(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;

}


/* ============================================================
   期間ボタン
============================================================ */

function createPeriodButtons(
  graphId,
  currentPeriod,
  onChange,
  options = PERIOD_ORDER
) {

  const div =
    document.createElement("div");


  div.className =
    "period-buttons";


  options.forEach(
    period => {

      const button =
        document.createElement("button");


      button.className =
        "period-button" +
        (
          period === currentPeriod
            ? " active"
            : ""
        );


      button.textContent =
        PERIOD_LABEL[period];


      button.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          onChange(period);

        }
      );


      div.appendChild(
        button
      );

    }
  );


  return div;

}


/* ============================================================
   全体期間ボタン
============================================================ */

function renderGlobalPeriodButtons() {

  const container =
    document.getElementById(
      "global-period-buttons"
    );


  if (!container) {

    return;

  }


  container.innerHTML =
    "";


  PERIOD_ORDER.forEach(
    period => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "global-period-button" +
        (
          period === GLOBAL_PERIOD
            ? " active"
            : ""
        );


      button.textContent =
        PERIOD_LABEL[period];


      button.addEventListener(
        "click",
        () => {

          GLOBAL_PERIOD =
            period;


          /*
            全体期間が変わったら
            画面を丸ごと再描画。

            これによって

            業界TOP10
            業界ランキング
            テーマTOP10
            テーマランキング
            値上がり銘柄

            すべて同じ期間になる。
          */

          renderGlobalPeriodButtons();

          renderApp(
            DATA,
            false
          );

        }
      );


      container.appendChild(
        button
      );

    }
  );

}


/* ============================================================
   日付表示
============================================================ */

function formatAxisDate(
  dateString,
  period
) {

  const d =
    new Date(dateString);


  if (
    Number.isNaN(
      d.getTime()
    )
  ) {

    return dateString;

  }


  const year =
    String(
      d.getFullYear()
    ).slice(-2);


  const month =
    String(
      d.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      d.getDate()
    ).padStart(2, "0");


  /*
    5年

    例:
    26/05
  */

  if (
    period === "5y"
  ) {

    return (
      year +
      "/" +
      month
    );

  }


  /*
    1月・半年

    例:
    09/02
  */

  return (
    month +
    "/" +
    day
  );

}


/* ============================================================
   境界マーカー
============================================================ */

const boundaryMarkerPlugin = {

  id: "boundaryMarker",


  afterDatasetsDraw(
    chart,
    args,
    pluginOptions
  ) {

    const boundaryDate =
      pluginOptions?.boundaryDate;


    if (!boundaryDate) {

      return;

    }


    const labels =
      chart.data.labels || [];


    if (!labels.length) {

      return;

    }


    const targetTime =
      new Date(
        boundaryDate
      ).getTime();


    let bestIndex =
      -1;


    let bestDiff =
      Infinity;


    labels.forEach(
      (label, index) => {

        const time =
          new Date(label)
            .getTime();


        if (
          Number.isNaN(time)
        ) {

          return;

        }


        const diff =
          Math.abs(
            time -
            targetTime
          );


        if (
          diff < bestDiff
        ) {

          bestDiff =
            diff;

          bestIndex =
            index;

        }

      }
    );


    if (
      bestIndex < 0
    ) {

      return;

    }


    const meta =
      chart.getDatasetMeta(0);


    if (
      !meta ||
      !meta.data ||
      !meta.data[bestIndex]
    ) {

      return;

    }


    const point =
      meta.data[bestIndex];


    const ctx =
      chart.ctx;


    ctx.save();


    ctx.fillStyle =
      "#d60000";


    const x =
      point.x;


    const y =
      chart.chartArea.top + 3;


    ctx.beginPath();


    ctx.moveTo(
      x,
      y + 9
    );


    ctx.lineTo(
      x - 6,
      y
    );


    ctx.lineTo(
      x + 6,
      y
    );


    ctx.closePath();


    ctx.fill();


    ctx.restore();

  }

};


Chart.register(
  boundaryMarkerPlugin
);


/* ============================================================
   日付境界
============================================================ */

function getBoundaryDate(
  history,
  period
) {

  if (
    !history ||
    !history.length
  ) {

    return null;

  }


  const newest =
    new Date(
      history[
        history.length - 1
      ].date
    );


  if (
    Number.isNaN(
      newest.getTime()
    )
  ) {

    return null;

  }


  /*
    詳細半年

    1か月前に赤い▽
  */

  if (
    period === "6m"
  ) {

    const d =
      new Date(newest);


    d.setMonth(
      d.getMonth() - 1
    );


    return d.toISOString();

  }


  /*
    詳細5年

    6か月前に赤い▽
  */

  if (
    period === "5y"
  ) {

    const d =
      new Date(newest);


    d.setMonth(
      d.getMonth() - 6
    );


    return d.toISOString();

  }


  return null;

}


/* ============================================================
   TOPグラフ用 history
============================================================ */

function getTopHistory(
  item
) {

  return (
    item?.history ||
    []
  );

}


/* ============================================================
   詳細グラフ用 history
============================================================ */

/*
  詳細グラフは

  常に
  「1か月前 = 100」

  を基準にする。


  1m:
    periods.1m.history

  6m:
    from_1m_6m

  5y:
    from_1m_5y

  を優先する。


  Python側で cross history が存在する
  現在の data.json 構造に対応。
*/

function getDetailHistory(
  item,
  period
) {

  if (!item) {

    return [];

  }


  /*
    1か月
  */

  if (
    period === "1m"
  ) {

    return (
      item
        ?.periods
        ?.["1m"]
        ?.history ||
      []
    );

  }


  /*
    半年

    1か月前=100のまま
  */

  if (
    period === "6m"
  ) {

    return (
      item
        ?.from_1m_6m ||
      item
        ?.periods
        ?.["6m"]
        ?.history ||
      []
    );

  }


  /*
    5年

    1か月前=100のまま
  */

  if (
    period === "5y"
  ) {

    return (
      item
        ?.from_1m_5y ||
      item
        ?.periods
        ?.["5y"]
        ?.history ||
      []
    );

  }


  return [];

}


/* ============================================================
   グラフ用データ作成
============================================================ */

function makeDatasets(
  items,
  period,
  detailMode = false
) {

  const dateMap =
    new Map();


  const labels =
    [];


  items.forEach(
    item => {

      let label;


      if (
        item?.industry
      ) {

        label =
          item.industry;

      }

      else if (
        item?.theme
      ) {

        label =
          item.theme;

      }

      else {

        label =
          item?.name;

      }


      if (
        !label
      ) {

        return;

      }


      if (
        !labels.includes(label)
      ) {

        labels.push(label);

      }


      /*
        詳細グラフかどうかで
        historyの取得方法を分ける。
      */

      const history =
        detailMode

          ? getDetailHistory(
              item,
              period
            )

          : getTopHistory(
              item
            );


      history.forEach(
        point => {

          if (
            !point ||
            !point.date
          ) {

            return;

          }


          if (
            !dateMap.has(
              point.date
            )
          ) {

            dateMap.set(
              point.date,
              {}
            );

          }


          const value =
            safeNumber(
              point.value
            );


          if (
            value !== null
          ) {

            dateMap
              .get(point.date)
              [label] =
              value;

          }

        }
      );

    }
  );


  const dates =
    Array.from(
      dateMap.keys()
    ).sort();


  const datasets =
    labels.map(
      label => {

        return {

          label,

          data:
            dates.map(
              date =>
                dateMap
                  .get(date)
                  ?.[label] ??
                null
            ),

          borderWidth: 1.5,

          pointRadius: 0,

          pointHoverRadius: 3,

          tension: 0.15,

          spanGaps: true

        };

      }
    );


  return {

    dates,

    datasets

  };

}


/* ============================================================
   グラフ作成
============================================================ */

function createLineChart(
  canvas,
  items,
  period,
  detailMode = false
) {

  if (
    !items ||
    !items.length
  ) {

    return null;

  }


  const result =
    makeDatasets(
      items,
      period,
      detailMode
    );


  if (
    !result.dates.length
  ) {

    return null;

  }


  const labels =
    result.dates;


  const datasets =
    result.datasets;


  /*
    境界日の計算

    詳細グラフの場合だけ使用。
  */

  let boundaryDate =
    null;


  if (
    detailMode
  ) {

    const firstHistory =
      getDetailHistory(
        items[0],
        period
      );


    boundaryDate =
      getBoundaryDate(
        firstHistory,
        period
      );

  }


  const ctx =
    canvas.getContext(
      "2d"
    );


  return new Chart(
    ctx,
    {

      type: "line",


      data: {

        labels,

        datasets

      },


      options: {

        responsive: true,

        maintainAspectRatio: false,


        interaction: {

          mode: "index",

          intersect: false

        },


        plugins: {

          legend: {

            display: true,

            position: "bottom",

            labels: {

              font: {

                size: 9

              },

              boxWidth: 7,

              boxHeight: 7,

              padding: 4

            }

          },


          tooltip: {

            callbacks: {

              title:
                function(
                  tooltipItems
                ) {

                  if (
                    !tooltipItems.length
                  ) {

                    return "";

                  }


                  return formatAxisDate(
                    tooltipItems[0]
                      .label,
                    period
                  );

                },


              label:
                function(
                  context
                ) {

                  const value =
                    context.parsed.y;


                  if (
                    value === null ||
                    value === undefined
                  ) {

                    return "";

                  }


                  return (
                    context.dataset.label +
                    ": " +
                    value.toFixed(1)
                  );

                }

            }

          },


          boundaryMarker: {

            boundaryDate

          }

        },


        scales: {

          x: {

            ticks: {

              autoSkip: true,

              maxTicksLimit:
                period === "1m"
                  ? 7
                  : period === "6m"
                    ? 7
                    : 9,

              maxRotation: 0,

              minRotation: 0,

              font: {

                size: 9

              },


              callback:
                function(value) {

                  const label =
                    this
                      .getLabelForValue(
                        value
                      );


                  return formatAxisDate(
                    label,
                    period
                  );

                }

            },


            grid: {

              display: false

            }

          },


          y: {

            ticks: {

              font: {

                size: 9

              },


              callback:
                function(value) {

                  return Number(
                    value
                  ).toFixed(0);

                }

            }

          }

        }

      }

    }
  );

}


/* ============================================================
   TOPグラフの取得
============================================================ */

function getTopGraphItems(
  graphType,
  period
) {

  if (
    graphType === "industryTop"
  ) {

    return (
      DATA
        ?.[period]
        ?.top_industries ||
      []
    );

  }


  if (
    graphType === "themeTop"
  ) {

    return (
      DATA
        ?.[period]
        ?.top_themes ||
      []
    );

  }


  return [];

}


/* ============================================================
   グラフ表示エリア
============================================================ */

function createGraphArea(
  container,
  items,
  graphId,
  defaultPeriod,
  isDetail,
  graphType = "detail"
) {

  if (
    !items ||
    !items.length
  ) {

    container.innerHTML =
      '<div class="message">データがありません</div>';

    return;

  }


  if (
    chartPeriods[graphId] === undefined
  ) {

    chartPeriods[graphId] =
      defaultPeriod;

  }


  function render() {

    container.innerHTML =
      "";


    const period =
      chartPeriods[graphId];


    let graphItems;


    /*
      ========================================
      TOPグラフ
      ========================================

      ここでは必ず

      1m → DATA["1m"]
      6m → DATA["6m"]
      5y → DATA["5y"]

      を使う。

      したがってグラフ自体の基準値も
      Python側で作られた各期間用データに
      切り替わる。
    */

    if (
      graphType === "industryTop" ||
      graphType === "themeTop"
    ) {

      graphItems =
        getTopGraphItems(
          graphType,
          period
        );

    }


    /*
      ========================================
      詳細グラフ
      ========================================

      こちらは元のstocksを使う。

      periods / from_1m_6m /
      from_1m_5y をJS側で切り替える。
    */

    else {

      graphItems =
        items;

    }


    if (
      !graphItems ||
      !graphItems.length
    ) {

      container.innerHTML =
        '<div class="message">この期間のデータがありません</div>';

      return;

    }


    /*
      期間ボタン

      TOPグラフ：
        1月 / 半年 / 5年

      詳細グラフ：
        1月 / 半年 / 5年

      ただし詳細グラフでは
      基準値は常に1か月前=100。
    */

    const buttons =
      createPeriodButtons(
        graphId,
        period,
        newPeriod => {

          chartPeriods[graphId] =
            newPeriod;


          /*
            TOPグラフを操作した場合は
            ランキングも同じ期間にする。

            詳細グラフの場合は
            ランキングを変更しない。
          */

          if (
            graphType === "industryTop" ||
            graphType === "themeTop"
          ) {

            GLOBAL_PERIOD =
              newPeriod;


            renderGlobalPeriodButtons();

            renderApp(
              DATA,
              false
            );

            return;

          }


          render();

        }
      );


    container.appendChild(
      buttons

/* ============================================================
   期間別の銘柄騰落率
============================================================ */

/*
  ランキング用の数字は
  TOPグラフとは別に計算する。


  stock.periods[period].change_percent

  を優先する。


  これによって

  1m → 1か月前基準
  6m → 6か月前基準
  5y → 5年前基準

  になる。
*/

function getStockChangeForPeriod(
  stock,
  period
) {

  if (!stock) {

    return null;

  }


  const periodData =
    stock
      ?.periods
      ?.[period];


  if (
    periodData &&
    periodData.change_percent !== undefined
  ) {

    return safeNumber(
      periodData.change_percent
    );

  }


  /*
    念のため
    change が存在する場合にも対応。
  */

  if (
    periodData &&
    periodData.change !== undefined
  ) {

    return safeNumber(
      periodData.change
    );

  }


  /*
    1mなら従来の
    stock.change_percent
    も使用。
  */

  if (
    period === "1m" &&
    stock.change_percent !== undefined
  ) {

    return safeNumber(
      stock.change_percent
    );

  }


  return null;

}


/* ============================================================
   業界ランキング値
============================================================ */

/*
  業界ランキングは

  「その業界に属する銘柄の
   騰落率平均」

  とする。
*/

function getIndustryAverageChange(
  industryName,
  period
) {

  const stocks =
    DATA
      ?.[period]
      ?.industry_stocks
      ?.[industryName]
    ||
    DATA
      ?.["1m"]
      ?.industry_stocks
      ?.[industryName]
    ||
    [];


  const values =
    stocks
      .map(
        stock =>
          getStockChangeForPeriod(
            stock,
            period
          )
      )
      .filter(
        value =>
          value !== null
      );


  if (!values.length) {

    /*
      TOP側に値があれば
      最後の保険として使用。
    */

    const top =
      DATA
        ?.[period]
        ?.top_industries
        ?.find(
          item =>
            item.industry ===
            industryName
        );


    return safeNumber(
      top?.change_percent
    );

  }


  return (
    values.reduce(
      (sum, value) =>
        sum + value,
      0
    ) /
    values.length
  );

}


/* ============================================================
   テーマランキング値
============================================================ */

function getThemeAverageChange(
  themeName,
  period
) {

  return (

        sum + value,
      0
    ) /
    values.length
  );

}

async function loadData() {

  const updated =
    document.getElementById(
      "updated"
    );


  try {

    const response =
      await fetch(
        "./data.json?ts=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data["1m"]
    ) {

      throw new Error(
        "1mデータがありません"
      );

    }


    if (
      !data["6m"]
    ) {

      console.warn(
        "6mデータがありません"
      );

    }


    if (
      !data["5y"]
    ) {

      console.warn(
        "5yデータがありません"
      );

    }


    if (
      data.updated_at
    ) {

      updated.textContent =
        "最終更新: " +
        data.updated_at;

    }


    DATA =
      data;


    /*
      初期状態
      → 1か月
    */

    GLOBAL_PERIOD =
      "1m";


    renderGlobalPeriodButtons();


    renderApp(
      data,
      true
    );

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    updated.textContent =
      "データ読み込みエラー";


    document.getElementById(
      "app"
    ).innerHTML = `

      <section>

        <div class="message">

          データを読み込めませんでした。<br><br>

          <small>
            ${error.message}
          </small>

        </div>

      </section>

    `;

  }

}


/* ============================================================

============================================================ */

loadData();
