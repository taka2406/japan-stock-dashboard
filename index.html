<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<meta
name="apple-mobile-web-app-capable"
content="yes"

>

<meta
name="apple-mobile-web-app-status-bar-style"
content="default"

>

<meta
name="theme-color"
content="#ffffff"

>

  <title>日本株ダッシュボード</title>

  <!-- Chart.js -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      background: #f5f5f5;

      color: #222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    }

    /* =========================
       ヘッダー
    ========================= */

    header {

      position: sticky;

      top: 0;

      z-index: 100;

      background:
        rgba(255,255,255,0.96);

      backdrop-filter: blur(8px);

      border-bottom:
        1px solid #ddd;

      padding:
        11px 14px;

    }

    header h1 {

      margin: 0;

      font-size: 21px;

      font-weight: 700;

    }

    #updated {

      margin-top: 4px;

      font-size: 11px;

      color: #777;

    }

    /* =========================
       メイン
    ========================= */

    main {

      max-width: 1000px;

      margin: 0 auto;

      padding: 10px;

    }

    section {

      background: white;

      border-radius: 12px;

      margin-bottom: 14px;

      padding: 12px;

      box-shadow:
        0 1px 4px
        rgba(0,0,0,0.08);

    }

    section h2 {

      margin:
        0 0 4px;

      font-size: 17px;

      font-weight: 700;

    }

    .section-subtitle {

      font-size: 11px;

      color: #888;

      margin-bottom: 7px;

    }

    /* =========================
       グラフ
    ========================= */

    .chart-area {

      width: 100%;

    }

    .chart-box {

      position: relative;

      width: 100%;

      height: 320px;

    }

    .detail-chart-box {

      position: relative;

      width: 100%;

      height: 280px;

    }

    @media (max-width: 600px) {

      .chart-box {

        height: 320px;

      }

      .detail-chart-box {

        height: 260px;

      }

    }

    /* =========================
       期間ボタン
    ========================= */

    .period-buttons {

      display: flex;

      gap: 5px;

      margin:
        2px 0 6px;

    }

    .period-button {

      border:
        1px solid #ccc;

      background: #fff;

      color: #555;

      border-radius: 6px;

      padding:
        4px 10px;

      font-size: 11px;

      line-height: 1.2;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }

    .period-button.active {

      background: #222;

      color: #fff;

      border-color: #222;

    }

    /* =========================
       ランキング
    ========================= */

    .ranking {

      margin-top: 5px;

    }

    .ranking-row {

      display: flex;

      align-items: center;

      min-height: 39px;

      border-bottom:
        1px solid #eee;

      cursor: pointer;

      user-select: none;

    }

    .ranking-row:last-child {

      border-bottom: none;

    }

    .rank {

      width: 34px;

      flex-shrink: 0;

      text-align: center;

      font-size: 13px;

      color: #777;

    }

    .name {

      flex: 1;

      min-width: 0;

      font-size: 14px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

    }

    .change {

      width: 72px;

      flex-shrink: 0;

      text-align: right;

      font-size: 13px;

      font-weight: 600;

    }

    .up {

      color: #d60000;

    }

    .down {

      color: #0066cc;

    }

    /* =========================
       詳細
    ========================= */

    .detail {

      background: #fafafa;

      padding: 8px;

      border-radius: 8px;

      margin:
        4px 0 8px;

    }

    .detail-title {

      font-size: 15px;

      font-weight: 700;

      margin:
        2px 0 4px;

    }

    /* =========================
       銘柄ランキング
    ========================= */

    .stock-row {

      display: flex;

      align-items: center;

      min-height: 34px;

      border-bottom:
        1px solid #e8e8e8;

    }

    .stock-row:last-child {

      border-bottom: none;

    }

    .stock-code {

      width: 52px;

      flex-shrink: 0;

      color: #888;

      font-size: 11px;

    }

    .stock-name {

      flex: 1;

      min-width: 0;

      font-size: 13px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

    }

    .stock-change {

      width: 68px;

      flex-shrink: 0;

      text-align: right;

      font-size: 12px;

      font-weight: 600;

    }

    /* =========================
       メッセージ
    ========================= */

    .message {

      padding:
        20px 10px;

      text-align: center;

      color: #888;

      font-size: 13px;

    }

  </style>

</head>

<body>

<header>

  <h1>
    日本株ダッシュボード
  </h1>

  <div id="updated">
    データ読み込み中...
  </div>

</header>

<main id="app">

  <div class="message">
    データ読み込み中...
  </div>

</main>

<script>


/* ============================================================
   基本設定
============================================================ */

let DATA = null;


/*
  グラフごとに現在選択している期間を保存
*/

const chartPeriods = {};


const PERIOD_LABEL = {

  "1m": "1月",

  "6m": "半年",

  "5y": "5年"

};


const PERIOD_ORDER = [

  "1m",
  "6m",
  "5y"

];


/* ============================================================
   表示用関数
============================================================ */

function periodLabel(period) {

  return PERIOD_LABEL[period] || period;

}


function formatPercent(value) {

  if (
    value === null ||
    value === undefined ||
    Number.isNaN(Number(value))
  ) {

    return "-";

  }


  const n =
    Number(value) * 100;


  const sign =
    n > 0 ? "+" : "";


  return (
    sign +
    n.toFixed(1) +
    "%"
  );

}


function changeClass(value) {

  return Number(value) >= 0
    ? "up"
    : "down";

}


/* ============================================================
   期間ボタン
============================================================ */

function createPeriodButtons(
  graphId,
  currentPeriod,
  onChange
) {

  const div =
    document.createElement("div");


  div.className =
    "period-buttons";


  PERIOD_ORDER.forEach(
    period => {

      const button =
        document.createElement("button");


      button.className =
        "period-button" +
        (
          period === currentPeriod
            ? " active"
            : ""
        );


      button.textContent =
        PERIOD_LABEL[period];


      button.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          onChange(period);

        }
      );


      div.appendChild(button);

    }
  );


  return div;

}


/* ============================================================
   日付表示
============================================================ */

function formatAxisDate(
  dateString,
  period
) {

  const d =
    new Date(dateString);


  if (
    Number.isNaN(
      d.getTime()
    )
  ) {

    return dateString;

  }


  const year =
    String(
      d.getFullYear()
    ).slice(-2);


  const month =
    String(
      d.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      d.getDate()
    ).padStart(2, "0");


  /*
    5年：
    年/月
    例：26/05
  */

  if (period === "5y") {

    return (
      year +
      "/" +
      month
    );

  }


  /*
    1月・半年：
    月/日
    例：09/02
  */

  return (
    month +
    "/" +
    day
  );

}


/* ============================================================
   境界マーカー
============================================================ */

const boundaryMarkerPlugin = {

  id: "boundaryMarker",


  afterDatasetsDraw(
    chart,
    args,
    pluginOptions
  ) {

    const boundaryDate =
      pluginOptions?.boundaryDate;


    if (!boundaryDate) {

      return;

    }


    const labels =
      chart.data.labels || [];


    if (!labels.length) {

      return;

    }


    const targetTime =
      new Date(
        boundaryDate
      ).getTime();


    let bestIndex = -1;

    let bestDiff =
      Infinity;


    labels.forEach(
      (label, index) => {

        const time =
          new Date(label)
            .getTime();


        if (
          Number.isNaN(time)
        ) {

          return;

        }


        const diff =
          Math.abs(
            time -
            targetTime
          );


        if (
          diff < bestDiff
        ) {

          bestDiff = diff;

          bestIndex =
            index;

        }

      }
    );


    if (bestIndex < 0) {

      return;

    }


    const meta =
      chart.getDatasetMeta(0);


    if (
      !meta ||
      !meta.data ||
      !meta.data[bestIndex]
    ) {

      return;

    }


    const point =
      meta.data[bestIndex];


    const ctx =
      chart.ctx;


    ctx.save();


    ctx.fillStyle =
      "#d60000";


    const x =
      point.x;


    const y =
      chart.chartArea.top + 3;


    ctx.beginPath();


    ctx.moveTo(
      x,
      y + 9
    );


    ctx.lineTo(
      x - 6,
      y
    );


    ctx.lineTo(
      x + 6,
      y
    );


    ctx.closePath();


    ctx.fill();


    ctx.restore();

  }

};


Chart.register(
  boundaryMarkerPlugin
);


/* ============================================================
   境界日の計算
============================================================ */

function getBoundaryDate(
  history,
  period
) {

  if (
    !history ||
    history.length === 0
  ) {

    return null;

  }


  /*
    半年表示：
    最新日から1か月前
  */

  if (period === "6m") {

    const newest =
      new Date(
        history[
          history.length - 1
        ].date
      );


    const d =
      new Date(newest);


    d.setMonth(
      d.getMonth() - 1
    );


    return d.toISOString();

  }


  /*
    5年表示：
    最新日から6か月前
  */

  if (period === "5y") {

    const newest =
      new Date(
        history[
          history.length - 1
        ].date
      );


    const d =
      new Date(newest);


    d.setMonth(
      d.getMonth() - 6
    );


    return d.toISOString();

  }


  return null;

}


/* ============================================================
   グラフ用データ
============================================================ */

function makeDatasets(
  items,
  period
) {

  const dateMap =
    new Map();


  items.forEach(
    item => {

      /*
        銘柄データの場合は

        item.periods[period].history

        を使用。

        業界・テーマTOP10の場合は
        渡されてきた item の history を使用。
      */

      const history =
        item
          ?.periods
          ?.[period]
          ?.history ||
        item?.history ||
        [];


      let label;


      /*
        業界
      */

      if (
        item.industry
      ) {

        label =
          item.industry;

      }


      /*
        テーマ
      */

      else if (
        item.theme
      ) {

        label =
          item.theme;

      }


      /*
        銘柄
      */

      else {

        label =
          item.name;

      }


      history.forEach(
        point => {

          if (
            !dateMap.has(
              point.date
            )
          ) {

            dateMap.set(
              point.date,
              {}
            );

          }


          dateMap
            .get(point.date)
            [label] =
              point.value;

        }
      );

    }
  );


  const dates =
    Array.from(
      dateMap.keys()
    ).sort();


  const labels =
    [];


  items.forEach(
    item => {

      let label;


      if (
        item.industry
      ) {

        label =
          item.industry;

      }

      else if (
        item.theme
      ) {

        label =
          item.theme;

      }

      else {

        label =
          item.name;

      }


      if (
        label &&
        !labels.includes(label)
      ) {

        labels.push(label);

      }

    }
  );


  const datasets =
    labels.map(
      label => {

        return {

          label: label,

          data:
            dates.map(
              date => {

                return (
                  dateMap
                    .get(date)
                    ?.[label] ??
                  null
                );

              }
            ),

          borderWidth: 1.5,

          pointRadius: 0,

          pointHoverRadius: 3,

          tension: 0.15,

          spanGaps: true

        };

      }
    );


  return {

    dates,

    datasets

  };

}


/* ============================================================
   グラフ作成
============================================================ */

function createLineChart(
  canvas,
  items,
  period
) {

  if (
    !items ||
    !items.length
  ) {

    return null;

  }


  const result =
    makeDatasets(
      items,
      period
    );


  if (
    !result.dates.length
  ) {

    return null;

  }


  const labels =
    result.dates;


  const datasets =
    result.datasets;


  /*
    境界日の計算

    業界・テーマTOP10でも
    銘柄でも同じ形式で処理できる
  */

  const firstHistory =
    items[0]
      ?.periods
      ?.[period]
      ?.history ||
    items[0]
      ?.history ||
    [];


  const boundaryDate =
    getBoundaryDate(
      firstHistory,
      period
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  return new Chart(
    ctx,
    {

      type: "line",


      data: {

        labels,

        datasets

      },


      options: {

        responsive: true,

        maintainAspectRatio: false,


        interaction: {

          mode: "index",

          intersect: false

        },


        plugins: {

          legend: {

            display: true,

            position: "bottom",

            labels: {

              font: {

                size: 9

              },

              boxWidth: 7,

              boxHeight: 7,

              padding: 4,

              usePointStyle: false

            }

          },


          tooltip: {

            callbacks: {

              title:
                function(
                  tooltipItems
                ) {

                  if (
                    !tooltipItems.length
                  ) {

                    return "";

                  }


                  return formatAxisDate(
                    tooltipItems[0]
                      .label,
                    period
                  );

                },


              label:
                function(
                  context
                ) {

                  const value =
                    context.parsed.y;


                  if (
                    value === null ||
                    value === undefined
                  ) {

                    return "";

                  }


                  return (
                    context.dataset.label +
                    ": " +
                    value.toFixed(1)
                  );

                }

            }

          },


          boundaryMarker: {

            boundaryDate

          }

        },


        scales: {

          x: {

            ticks: {

              autoSkip: true,

              maxTicksLimit:
                period === "1m"
                  ? 7
                  : period === "6m"
                    ? 7
                    : 9,

              maxRotation: 0,

              minRotation: 0,

              font: {

                size: 9

              },


              callback:
                function(
                  value
                ) {

                  const label =
                    this
                      .getLabelForValue(
                        value
                      );


                  return formatAxisDate(
                    label,
                    period
                  );

                }

            },


            grid: {

              display: false

            }

          },


          y: {

            ticks: {

              font: {

                size: 9

              },


              callback:
                function(value) {

                  return Number(
                    value
                  ).toFixed(0);

                }

            }

          }

        }

      }

    }
  );

}


/* ============================================================
   ★ グラフ表示用データを取得
============================================================ */

/*
  ここが今回の重要な修正部分。

  業界TOP10：
    DATA["1m"].top_industries
    DATA["6m"].top_industries
    DATA["5y"].top_industries

  テーマTOP10：
    DATA["1m"].top_themes
    DATA["6m"].top_themes
    DATA["5y"].top_themes

  銘柄詳細：
    元々渡された stocks をそのまま使う
    （中の periods から期間を切り替える）
*/

function getGraphItems(
  graphType,
  period,
  originalItems
) {

  /*
    業界TOP10
  */

  if (
    graphType === "industryTop"
  ) {

    return (
      DATA
        ?.[
          period
        ]
        ?.top_industries ||
      []
    );

  }


  /*
    テーマTOP10
  */

  if (
    graphType === "themeTop"
  ) {

    return (
      DATA
        ?.[
          period
        ]
        ?.top_themes ||
      []
    );

  }


  /*
    銘柄詳細グラフ
  */

  return originalItems || [];

}


/* ============================================================
   グラフ表示エリア
============================================================ */

function createGraphArea(
  container,
  items,
  graphId,
  defaultPeriod,
  isDetail,
  graphType = "detail"
) {

  if (
    !items ||
    !items.length
  ) {

    container.innerHTML =
      '<div class="message">データがありません</div>';

    return;

  }


  /*
    初回だけ1月
  */

  if (
    !chartPeriods[graphId]
  ) {

    chartPeriods[graphId] =
      defaultPeriod;

  }


  function render() {

    container.innerHTML =
      "";


    const period =
      chartPeriods[graphId];


    /*
      ★ 選択した期間に応じて
      グラフデータそのものを取得する
    */

    const graphItems =
      getGraphItems(
        graphType,
        period,
        items
      );


    if (
      !graphItems ||
      !graphItems.length
    ) {

      container.innerHTML =
        '<div class="message">この期間のデータがありません</div>';

      return;

    }


    /*
      期間ボタン
    */

    const buttons =
      createPeriodButtons(
        graphId,
        period,
        newPeriod => {

          chartPeriods[graphId] =
            newPeriod;

          render();

        }
      );


    container.appendChild(
      buttons
    );


    /*
      グラフ
    */

    const box =
      document.createElement(
        "div"
      );


    box.className =
      isDetail
        ? "detail-chart-box"
        : "chart-box";


    const canvas =
      document.createElement(
        "canvas"
      );


    box.appendChild(
      canvas
    );


    container.appendChild(
      box
    );


    /*
      ★ 選択された期間の
      graphItems を使用
    */

    const chart =
      createLineChart(
        canvas,
        graphItems,
        period
      );


    if (!chart) {

      container.innerHTML =
        '<div class="message">この期間のグラフデータがありません</div>';

    }

  }


  render();

}


/* ============================================================
   業界ランキング
============================================================ */

function renderIndustryRanking(
  container,
  dataset
) {

  const ranking =
    dataset
      ?.top_industries ||
    [];


  if (
    !ranking.length
  ) {

    container.innerHTML =
      '<div class="message">業界データがありません</div>';

    return;

  }


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "ranking";


  ranking.forEach(
    (item, index) => {

      const industryName =
        item.industry;


      const change =
        item.change_percent;


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "ranking-row";


      row.innerHTML = `

        <div class="rank">
          ${index + 1}
        </div>

        <div class="name">
          ${industryName}
        </div>

        <div class="change ${changeClass(change)}">
          ${formatPercent(change)}
        </div>

      `;


      wrapper.appendChild(
        row
      );


      /*
        詳細
      */

      const detail =
        document.createElement(
          "div"
        );


      detail.className =
        "detail";


      detail.style.display =
        "none";


      const detailTitle =
        document.createElement(
          "div"
        );


      detailTitle.className =
        "detail-title";


      detailTitle.textContent =
        industryName;


      detail.appendChild(
        detailTitle
      );


      /*
        業界内銘柄グラフ
      */

      const graphContainer =
        document.createElement(
          "div"
        );


      graphContainer.className =
        "chart-area";


      detail.appendChild(
        graphContainer
      );


      const stocks =
        dataset
          ?.industry_stocks
          ?.[industryName] ||
        [];


      createGraphArea(
        graphContainer,
        stocks,
        "industry-" +
          industryName,
        "1m",
        true,
        "detail"
      );


      /*
        銘柄ランキング
      */

      const stockRanking =
        document.createElement(
          "div"
        );


      stockRanking.className =
        "ranking";


      const sortedStocks =
        [...stocks].sort(
          (a, b) =>
            Number(
              b.change_percent ||
              0
            ) -
            Number(
              a.change_percent ||
              0
            )
        );


      sortedStocks.forEach(
        stock => {

          const stockRow =
            document.createElement(
              "div"
            );


          stockRow.className =
            "stock-row";


          stockRow.innerHTML = `

            <div class="stock-code">
              ${stock.code || ""}
            </div>

            <div class="stock-name">
              ${stock.name || ""}
            </div>

            <div class="stock-change ${changeClass(stock.change_percent)}">
              ${formatPercent(stock.change_percent)}
            </div>

          `;


          stockRanking.appendChild(
            stockRow
          );

        }
      );


      detail.appendChild(
        stockRanking
      );


      wrapper.appendChild(
        detail
      );


      /*
        タップで開閉
      */

      row.addEventListener(
        "click",
        () => {

          detail.style.display =
            detail.style.display ===
            "none"
              ? "block"
              : "none";

        }
      );

    }
  );


  container.appendChild(
    wrapper
  );

}


/* ============================================================
   テーマランキング
============================================================ */

function renderThemeRanking(
  container,
  dataset
) {

  const ranking =
    dataset
      ?.top_themes ||
    [];


  if (
    !ranking.length
  ) {

    container.innerHTML =
      '<div class="message">テーマデータがありません</div>';

    return;

  }


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "ranking";


  ranking.forEach(
    (item, index) => {

      const themeName =
        item.theme;


      const change =
        item.change_percent;


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "ranking-row";


      row.innerHTML = `

        <div class="rank">
          ${index + 1}
        </div>

        <div class="name">
          ${themeName}
        </div>

        <div class="change ${changeClass(change)}">
          ${formatPercent(change)}
        </div>

      `;


      wrapper.appendChild(
        row
      );


      /*
        詳細
      */

      const detail =
        document.createElement(
          "div"
        );


      detail.className =
        "detail";


      detail.style.display =
        "none";


      const detailTitle =
        document.createElement(
        "div"
      );


      detailTitle.className =
        "detail-title";


      detailTitle.textContent =
        themeName;


      detail.appendChild(
        detailTitle
      );


      /*
        テーマ内銘柄グラフ
      */

      const graphContainer =
        document.createElement(
          "div"
        );


      graphContainer.className =
        "chart-area";


      detail.appendChild(
        graphContainer
      );


      const stocks =
        dataset
          ?.theme_stocks
          ?.[themeName] ||
        [];


      createGraphArea(
        graphContainer,
        stocks,
        "theme-" +
          themeName,
        "1m",
        true,
        "detail"
      );


      /*
        銘柄ランキング
      */

      const stockRanking =
        document.createElement(
          "div"
        );


      stockRanking.className =
        "ranking";


      const sortedStocks =
        [...stocks].sort(
          (a, b) =>
            Number(
              b.change_percent ||
              0
            ) -
            Number(
              a.change_percent ||
              0
            )
        );


      sortedStocks.forEach(
        stock => {

          const stockRow =
            document.createElement(
              "div"
            );


          stockRow.className =
            "stock-row";


          stockRow.innerHTML = `

            <div class="stock-code">
              ${stock.code || ""}
            </div>

            <div class="stock-name">
              ${stock.name || ""}
            </div>

            <div class="stock-change ${changeClass(stock.change_percent)}">
              ${formatPercent(stock.change_percent)}
            </div>

          `;


          stockRanking.appendChild(
            stockRow
          );

        }
      );


      detail.appendChild(
        stockRanking
      );


      wrapper.appendChild(
        detail
      );


      /*
        タップで開閉
      */

      row.addEventListener(
        "click",
        () => {

          detail.style.display =
            detail.style.display ===
            "none"
              ? "block"
              : "none";

        }
      );

    }
  );


  container.appendChild(
    wrapper
  );

}


/* ============================================================
   値上がり銘柄TOP10
============================================================ */

function renderTopGainers(
  container,
  dataset
) {

  const ranking =
    dataset
      ?.top_gainers ||
    [];


  if (
    !ranking.length
  ) {

    container.innerHTML =
      '<div class="message">値上がり銘柄データがありません</div>';

    return;

  }


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "ranking";


  ranking
    .slice(0, 10)
    .forEach(
      (item, index) => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "ranking-row";


        row.innerHTML = `

          <div class="rank">
            ${index + 1}
          </div>

          <div class="name">

            ${item.name || ""}

            ${
              item.code
                ? `
                  <span
                    style="
                      color:#999;
                      font-size:10px;
                    "
                  >
                    ${item.code}
                  </span>
                `
                : ""
            }

          </div>

          <div class="change ${changeClass(item.change_percent)}">
            ${formatPercent(item.change_percent)}
          </div>

        `;


        wrapper.appendChild(
          row
        );

      }
    );


  container.appendChild(
    wrapper
  );

}

/* ============================================================
   data.json読み込み
============================================================ */

async function loadData() {

  const updated =
    document.getElementById(
      "updated"
    );


  try {

    const response =
      await fetch(
        "./data.json?ts=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
      1月データ確認
    */

    if (
      !data["1m"]
    ) {

      throw new Error(
        "1mデータがありません"
      );

    }


    /*
      6か月・5年データ確認
    */

    if (
      !data["6m"]
    ) {

      console.warn(
        "6mデータがありません"
      );

    }


    if (
      !data["5y"]
    ) {

      console.warn(
        "5yデータがありません"
      );

    }


    /*
      更新時刻
    */

    if (
      data.updated_at
    ) {

      updated.textContent =
        "最終更新: " +
        data.updated_at;

    }


    renderApp(
      data
    );

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    updated.textContent =
      "データ読み込みエラー";


    document.getElementById(
      "app"
    ).innerHTML = `

      <section>

        <div class="message">

          データを読み込めませんでした。<br><br>

          <small>
            ${error.message}
          </small>

        </div>

      </section>

    `;

  }

}


/* ============================================================
   起動
============================================================ */

loadData();
