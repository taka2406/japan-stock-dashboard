<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>日本株ダッシュボード</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    margin: 0;

    background: #f5f5f5;

    color: #222;

}


.container {

    max-width: 700px;

    margin: auto;

    padding: 16px;

}


h1 {

    font-size: 24px;

    margin-bottom: 6px;

}


.updated {

    color: #777;

    font-size: 13px;

    margin-bottom: 20px;

}


.card {

    background: white;

    border-radius: 14px;

    padding: 16px;

    margin-bottom: 18px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.06);

}


h2 {

    font-size: 18px;

    margin-top: 0;

}


.chart-container {

    position: relative;

    width: 100%;

    height: 330px;

}


canvas {

    max-width: 100%;

}


.legend {

    margin-top: 12px;

    font-size: 12px;

    line-height: 1.8;

}


.legend-item {

    display: inline-block;

    margin-right: 10px;

}


.legend-line {

    display: inline-block;

    width: 18px;

    height: 3px;

    margin-right: 4px;

    vertical-align: middle;

}


/* -------------------------
   業界ランキング
------------------------- */

.industry-row {

    border-bottom: 1px solid #eee;

}


.industry-button {

    width: 100%;

    border: none;

    background: white;

    padding: 14px 4px;

    display: flex;

    align-items: center;

    text-align: left;

    font-size: 15px;

    cursor: pointer;

}


.industry-button:active {

    background: #f5f5f5;

}


.rank {

    width: 32px;

    font-weight: bold;

    color: #777;

}


.industry-name {

    flex: 1;

    font-weight: 600;

}


.industry-change {

    font-weight: bold;

    margin-right: 8px;

}


.arrow {

    width: 20px;

    text-align: center;

    color: #888;

    font-size: 13px;

}


/* -------------------------
   業界詳細
------------------------- */

.industry-detail {

    display: none;

    padding:
        4px
        4px
        18px
        36px;

    background: #fafafa;

}


.industry-detail.open {

    display: block;

}


.detail-title {

    font-size: 15px;

    font-weight: bold;

    margin:
        8px
        0
        12px;

}


.detail-chart {

    position: relative;

    height: 260px;

    margin-bottom: 14px;

}


/* -------------------------
   銘柄ランキング
------------------------- */

.stock-row {

    display: flex;

    align-items: center;

    padding: 9px 0;

    border-bottom: 1px solid #eee;

    font-size: 13px;

}


.stock-rank {

    width: 28px;

    color: #777;

}


.stock-code {

    width: 48px;

    color: #888;

    font-size: 11px;

}


.stock-name {

    flex: 1;

    font-weight: 500;

}


.stock-change {

    font-weight: bold;

}


.positive {

    color: #d33;

}


.negative {

    color: #1670c5;

}


.no-data {

    color: #888;

    font-size: 13px;

    padding: 10px 0;

}


</style>

</head>


<body>


<div class="container">


<h1>
日本株ダッシュボード
</h1>


<div
    class="updated"
    id="updated">
読み込み中...
</div>


<!-- =========================
     業界TOP10グラフ
========================= -->

<div class="card">

<h2>
上昇業界 TOP10
</h2>

<div class="chart-container">

<canvas id="industryChart"></canvas>

</div>

<div
    id="industryLegend"
    class="legend">
</div>

</div>


<!-- =========================
     全業界ランキング
========================= -->

<div class="card">

<h2>
業界ランキング
</h2>

<div id="industryRanking"></div>

</div>


<!-- =========================
     株価上昇TOP10
========================= -->

<div class="card">

<h2>
1か月値上がり銘柄 TOP10
</h2>

<div class="chart-container">

<canvas id="stockChart"></canvas>

</div>

<div
    id="stockLegend"
    class="legend">
</div>

</div>


</div>


<script>


let industryChart = null;

let stockChart = null;

let detailCharts = {};


// -------------------------
// データ取得
// -------------------------

fetch(
    "data.json",
    {
        cache: "no-store"
    }
)

.then(response => response.json())

.then(data => {

    document.getElementById(
        "updated"
    ).textContent =
        "最終更新: "
        + data.updated_at;


    // 業界TOP10グラフ

    createIndustryChart(
        data.top_industries
    );


    // 全業界ランキング

    createIndustryRanking(
        data.industries,
        data.industry_stocks
    );


    // 株価TOP10

    createStockChart(
        data.top_gainers
    );

})

.catch(error => {

    console.error(error);

    document.getElementById(
        "updated"
    ).textContent =
        "データ取得エラー";

});


// =========================
// 業界TOP10グラフ
// =========================

function createIndustryChart(
    industries
) {

    const ctx =
        document
        .getElementById(
            "industryChart"
        )
        .getContext("2d");


    const datasets =
        industries.map(
            (industry, index) => {

                return {

                    label:
                        industry.industry,

                    data:
                        industry.history.map(
                            item =>
                                item.value
                        ),

                    borderWidth: 2,

                    pointRadius: 0,

                    tension: 0.2

                };

            }
        );


    const labels =
        industries.length > 0
        ? industries[0].history.map(
            item => item.date
          )
        : [];


    industryChart =
        new Chart(
            ctx,
            {

                type: "line",

                data: {

                    labels: labels,

                    datasets: datasets

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    interaction: {

                        mode: "index",

                        intersect: false

                    },

                    plugins: {

                        legend: {

                            display: false

                        }

                    },

                    scales: {

                        y: {

                            title: {

                                display: true,

                                text:
                                    "1か月前 = 100"

                            }

                        }

                    }

                }

            }
        );


    createLegend(
        "industryLegend",
        industries
    );

}


// =========================
// 業界ランキング
// =========================

function createIndustryRanking(
    industries,
    industryStocks
) {

    const container =
        document.getElementById(
            "industryRanking"
        );


    container.innerHTML = "";


    industries.forEach(
        (industry, index) => {


            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "industry-row";


            // -------------------------
            // 業界ボタン
            // -------------------------

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "industry-button";


            const changeClass =
                industry.change_percent >= 0
                ? "positive"
                : "negative";


            button.innerHTML = `

                <span class="rank">
                    ${index + 1}
                </span>

                <span class="industry-name">
                    ${industry.industry}
                </span>

                <span class="industry-change ${changeClass}">
                    ${formatPercent(
                        industry.change_percent
                    )}
                </span>

                <span class="arrow">
                    ▼
                </span>

            `;


            // -------------------------
            // 詳細部分
            // -------------------------

            const detail =
                document.createElement(
                    "div"
                );

            detail.className =
                "industry-detail";


            const stocks =
                industryStocks[
                    industry.industry
                ] || [];


            detail.innerHTML = `

                <div class="detail-title">
                    ${industry.industry} の銘柄
                </div>

                <div class="detail-chart">

                    <canvas
                        id="chart-${index}">
                    </canvas>

                </div>

                <div id="stocks-${index}">
                </div>

            `;


            row.appendChild(
                button
            );

            row.appendChild(
                detail
            );


            container.appendChild(
                row
            );


            // -------------------------
            // クリック処理
            // -------------------------

            button.addEventListener(
                "click",
                function() {

                    const isOpen =
                        detail.classList.contains(
                            "open"
                        );


                    // 一度開いている場合
                    // → 閉じる

                    if (isOpen) {

                        detail.classList.remove(
                            "open"
                        );

                        button
                            .querySelector(
                                ".arrow"
                            )
                            .textContent =
                                "▼";

                        return;

                    }


                    // -------------------------
                    // 他の業界を閉じる
                    // -------------------------

                    document
                        .querySelectorAll(
                            ".industry-detail.open"
                        )
                        .forEach(
                            other => {

                                other.classList.remove(
                                    "open"
                                );

                            }
                        );


                    document
                        .querySelectorAll(
                            ".industry-button .arrow"
                        )
                        .forEach(
                            arrow => {

                                arrow.textContent =
                                    "▼";

                            }
                        );


                    // -------------------------
                    // この業界を開く
                    // -------------------------

                    detail.classList.add(
                        "open"
                    );


                    button
                        .querySelector(
                            ".arrow"
                        )
                        .textContent =
                            "▲";


                    createIndustryDetail(
                        index,
                        stocks
                    );

                }

            );

        }
    );

}


// =========================
// 業界詳細
// =========================

function createIndustryDetail(
    index,
    stocks
) {

    // -------------------------
    // 銘柄ランキング
    // -------------------------

    const stockContainer =
        document.getElementById(
            `stocks-${index}`
        );


    stockContainer.innerHTML = "";


    stocks.forEach(
        (stock, stockIndex) => {

            const changeClass =
                stock.change_percent >= 0
                ? "positive"
                : "negative";


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "stock-row";


            row.innerHTML = `

                <span class="stock-rank">
                    ${stockIndex + 1}
                </span>

                <span class="stock-code">
                    ${stock.code}
                </span>

                <span class="stock-name">
                    ${stock.name}
                </span>

                <span class="stock-change ${changeClass}">
                    ${formatPercent(
                        stock.change_percent
                    )}
                </span>

            `;


            stockContainer.appendChild(
                row
            );

        }
    );


    // -------------------------
    // 業界銘柄グラフ
    // -------------------------

    const canvas =
        document.getElementById(
            `chart-${index}`
        );


    if (!canvas) {
        return;
    }


    // 以前のグラフを削除

    if (detailCharts[index]) {

        detailCharts[index].destroy();

    }


    if (stocks.length === 0) {

        return;

    }


    const labels =
        stocks[0].history.map(
            item => item.date
        );


    const datasets =
        stocks.map(
            stock => {

                return {

                    label:
                        stock.code
                        + " "
                        + stock.name,

                    data:
                        stock.history.map(
                            item =>
                                item.value
                        ),

                    borderWidth: 2,

                    pointRadius: 0,

                    tension: 0.2

                };

            }
        );


    detailCharts[index] =
        new Chart(

            canvas.getContext(
                "2d"
            ),

            {

                type: "line",

                data: {

                    labels:
                        labels,

                    datasets:
                        datasets

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    interaction: {

                        mode: "index",

                        intersect: false

                    },

                    plugins: {

                        legend: {

                            display: false

                        }

                    },

                    scales: {

                        y: {

                            title: {

                                display: true,

                                text:
                                    "1か月前 = 100"

                            }

                        }

                    }

                }

            }

        );

}


// =========================
// 株価TOP10グラフ
// =========================

function createStockChart(
    stocks
) {

    const ctx =
        document
        .getElementById(
            "stockChart"
        )
        .getContext("2d");


    const labels =
        stocks.length > 0
        ? stocks[0].history.map(
            item => item.date
          )
        : [];


    const datasets =
        stocks.map(
            stock => {

                return {

                    label:
                        stock.code
                        + " "
                        + stock.name,

                    data:
                        stock.history.map(
                            item =>
                                item.value
                        ),

                    borderWidth: 2,

                    pointRadius: 0,

                    tension: 0.2

                };

            }
        );


    stockChart =
        new Chart(

            ctx,

            {

                type: "line",

                data: {

                    labels:
                        labels,

                    datasets:
                        datasets

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    interaction: {

                        mode: "index",

                        intersect: false

                    },

                    plugins: {

                        legend: {

                            display: false

                        }

                    },

                    scales: {

                        y: {

                            title: {

                                display: true,

                                text:
                                    "1か月前 = 100"

                            }

                        }

                    }

                }

            }

        );


    createLegend(
        "stockLegend",
        stocks
    );

}


// =========================
// 凡例
// =========================

function createLegend(
    elementId,
    items
) {

    const container =
        document.getElementById(
            elementId
        );


    container.innerHTML = "";


    items.forEach(
        (item, index) => {

            const div =
                document.createElement(
                    "span"
                );


            div.className =
                "legend-item";


            div.innerHTML = `

                <span
                    class="legend-line"
                    style="
                        background:
                        hsl(
                            ${index * 37 % 360},
                            70%,
                            50%
                        );
                    ">
                </span>

                ${item.code
                    ? item.code + " "
                    : ""
                }

                ${item.name
                    ? item.name
                    : item.industry
                }

            `;


            container.appendChild(
                div
            );

        }
    );

}


// =========================
// %表示
// =========================

function formatPercent(
    value
) {

    const sign =
        value >= 0
        ? "+"
        : "";

    return (
        sign
        + Number(value).toFixed(2)
        + "%"
    );

}


</script>

</body>

</html>
