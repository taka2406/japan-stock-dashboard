<script>

/* ============================================================
   基本設定
============================================================ */

let DATA = null;

let CURRENT_PERIOD = "1m";

const charts = [];


/* ============================================================
   表示用
============================================================ */

const PERIOD_LABEL = {
  "1m": "1月",
  "6m": "半年",
  "5y": "5年"
};


function formatPercent(value) {

  if (
    value === null ||
    value === undefined ||
    Number.isNaN(Number(value))
  ) {
    return "-";
  }

  /*
    change_percent が

    0.4714
    ↓
    +47.1%

    となるようにする
  */

  const n = Number(value) * 100;

  const sign = n > 0 ? "+" : "";

  return sign + n.toFixed(1) + "%";
}


function changeClass(value) {

  return Number(value) >= 0
    ? "up"
    : "down";
}


/* ============================================================
   ランキング用の正しい変化率
============================================================ */

/*
  Python側のデータによっては
  change_percent が既に正しい場合もあるが、

  ランキングでは
  「基準値100 → 現在値571.4」

  なら

  (571.4 - 100) / 100
  = 4.714

  ではなく

  471.4 / 100
  = 4.714

  という計算になる。

  しかしグラフの値が
  100 → 571.4
  の場合に表示したいのは +471.4%。

  そこでランキングについては
  構成銘柄の「現在値 / 基準値 - 1」
  を平均して再計算する。
*/


function getStockChangeForPeriod(stock, period) {

  const p =
    stock
      ?.periods
      ?.[period];

  if (!p) {
    return null;
  }

  /*
    Pythonのperiodデータに
    change_percent がある場合
  */

  if (
    p.change_percent !== undefined &&
    p.change_percent !== null
  ) {

    return Number(p.change_percent);

  }

  /*
    historyから計算
  */

  const history =
    p.history || [];

  if (history.length < 2) {
    return null;
  }

  const base =
    Number(history[0].value);

  const latest =
    Number(
      history[history.length - 1].value
    );

  if (
    !Number.isFinite(base) ||
    !Number.isFinite(latest) ||
    base === 0
  ) {
    return null;
  }

  return (
    latest / base - 1
  );
}


/* ============================================================
   業界・テーマの平均変化率
============================================================ */

function calculateGroupChange(
  stocks,
  period
) {

  if (
    !stocks ||
    !stocks.length
  ) {
    return null;
  }

  const values = [];

  stocks.forEach(stock => {

    const change =
      getStockChangeForPeriod(
        stock,
        period
      );

    if (
      change !== null &&
      Number.isFinite(change)
    ) {
      values.push(change);
    }

  });

  if (!values.length) {
    return null;
  }

  const total =
    values.reduce(
      (sum, value) =>
        sum + value,
      0
    );

  return total / values.length;
}


/* ============================================================
   グラフの期間データ取得
============================================================ */

function getHistoryForStock(
  stock,
  period,
  detailMode = false
) {

  if (!stock) {
    return [];
  }

  /*
    詳細グラフは

    1月基準のまま

    半年表示：
      from_1m_6m

    5年表示：
      from_1m_5y

    を優先する。
  */

  if (detailMode) {

    if (period === "1m") {

      return (
        stock
          ?.periods
          ?.["1m"]
          ?.history ||
        []
      );

    }

    if (period === "6m") {

      return (
        stock
          ?.periods
          ?.from_1m_6m ||
        stock
          ?.periods
          ?.["6m"]
          ?.history ||
        []
      );

    }

    if (period === "5y") {

      return (
        stock
          ?.periods
          ?.from_1m_5y ||
        stock
          ?.periods
          ?.["5y"]
          ?.history ||
        []
      );

    }

  }

  return (
    stock
      ?.periods
      ?.[period]
      ?.history ||
    []
  );
}


/* ============================================================
   境界日の計算
============================================================ */

function getBoundaryDate(
  history,
  period
) {

  if (
    !history ||
    history.length === 0
  ) {
    return null;
  }

  /*
    最新日
  */

  const newest =
    new Date(
      history[
        history.length - 1
      ].date
    );

  /*
    半年表示
    → 1か月前
  */

  if (period === "6m") {

    const d =
      new Date(newest);

    d.setMonth(
      d.getMonth() - 1
    );

    return d;

  }

  /*
    5年表示
    → 半年前
  */

  if (period === "5y") {

    const d =
      new Date(newest);

    d.setMonth(
      d.getMonth() - 6
    );

    return d;

  }

  return null;
}


/* ============================================================
   軸の日付
============================================================ */

function formatAxisDate(
  dateString,
  period
) {

  const d =
    new Date(dateString);

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {
    return dateString;
  }

  const year =
    String(
      d.getFullYear()
    ).slice(-2);

  const month =
    String(
      d.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      d.getDate()
    ).padStart(2, "0");

  if (period === "5y") {

    return year + "/" + month;

  }

  return month + "/" + day;
}


/* ============================================================
   グラフ用データ作成
============================================================ */

function makeStockDatasets(
  items,
  period,
  detailMode
) {

  const dateMap =
    new Map();

  const labels = [];

  items.forEach(
    stock => {

      const history =
        getHistoryForStock(
          stock,
          period,
          detailMode
        );

      if (!history.length) {
        return;
      }

      const label =
        stock.name ||
        stock.code ||
        "銘柄";

      if (
        !labels.includes(label)
      ) {
        labels.push(label);
      }

      history.forEach(
        point => {

          if (
            !dateMap.has(
              point.date
            )
          ) {

            dateMap.set(
              point.date,
              {}
            );

          }

          dateMap
            .get(point.date)
            [label] =
              Number(point.value);

        }
      );

    }
  );

  const dates =
    Array.from(
      dateMap.keys()
    ).sort();

  const datasets =
    labels.map(
      label => ({

        label,

        data:
          dates.map(
            date =>
              dateMap
                .get(date)
                ?.[label] ??
              null
          ),

        borderWidth: 1.5,

        pointRadius: 0,

        pointHoverRadius: 3,

        tension: 0.15,

        spanGaps: true

      })
    );

  return {
    dates,
    datasets
  };
}


/* ============================================================
   業界・テーマTOP10グラフ
============================================================ */

function makeGroupDatasets(
  items,
  period
) {

  const dateMap =
    new Map();

  const labels = [];

  items.forEach(
    item => {

      const label =
        item.industry ||
        item.theme ||
        item.name;

      if (!label) {
        return;
      }

      if (
        !labels.includes(label)
      ) {
        labels.push(label);
      }

      /*
        TOP10のグラフについては
        その期間専用の history を使う。

        1m → 1か月前=100
        6m → 半年前=100
        5y → 5年前=100
      */

      const history =
        item.history || [];

      history.forEach(
        point => {

          if (
            !dateMap.has(
              point.date
            )
          ) {

            dateMap.set(
              point.date,
              {}
            );

          }

          dateMap
            .get(point.date)
            [label] =
              Number(point.value);

        }
      );

    }
  );

  const dates =
    Array.from(
      dateMap.keys()
    ).sort();

  const datasets =
    labels.map(
      label => ({

        label,

        data:
          dates.map(
            date =>
              dateMap
                .get(date)
                ?.[label] ??
              null
          ),

        borderWidth: 1.5,

        pointRadius: 0,

        pointHoverRadius: 3,

        tension: 0.15,

        spanGaps: true

      })
    );

  return {
    dates,
    datasets
  };
}


/* ============================================================
   赤▽プラグイン
============================================================ */

const boundaryMarkerPlugin = {

  id: "boundaryMarker",

  afterDatasetsDraw(
    chart,
    args,
    pluginOptions
  ) {

    const boundaryDate =
      pluginOptions?.boundaryDate;

    if (!boundaryDate) {
      return;
    }

    const labels =
      chart.data.labels || [];

    if (!labels.length) {
      return;
    }

    const targetTime =
      new Date(
        boundaryDate
      ).getTime();

    let bestIndex = -1;
    let bestDiff = Infinity;

    labels.forEach(
      (label, index) => {

        const time =
          new Date(label)
            .getTime();

        if (
          Number.isNaN(time)
        ) {
          return;
        }

        const diff =
          Math.abs(
            time -
            targetTime
          );

        if (
          diff < bestDiff
        ) {

          bestDiff = diff;
          bestIndex = index;

        }

      }
    );

    if (
      bestIndex < 0
    ) {
      return;
    }

    const meta =
      chart.getDatasetMeta(0);

    if (
      !meta ||
      !meta.data ||
      !meta.data[bestIndex]
    ) {
      return;
    }

    const point =
      meta.data[bestIndex];

    const ctx =
      chart.ctx;

    ctx.save();

    ctx.fillStyle =
      "#d60000";

    const x =
      point.x;

    const y =
      chart.chartArea.top + 2;

    ctx.beginPath();

    ctx.moveTo(
      x,
      y + 9
    );

    ctx.lineTo(
      x - 6,
      y
    );

    ctx.lineTo(
      x + 6,
      y
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
  }
};

Chart.register(
  boundaryMarkerPlugin
);


/* ============================================================
   Chart.js グラフ作成
============================================================ */

function createChart(
  canvas,
  dates,
  datasets,
  period,
  detailMode
) {

  if (
    !dates.length ||
    !datasets.length
  ) {
    return null;
  }

  const boundaryDate =
    getBoundaryDate(
      dates.map(
        date => ({
          date
        })
      ),
      period
    );

  const chart =
    new Chart(
      canvas.getContext("2d"),
      {

        type: "line",

        data: {
          labels: dates,
          datasets
        },

        options: {

          responsive: true,

          maintainAspectRatio: false,

          interaction: {
            mode: "index",
            intersect: false
          },

          plugins: {

            legend: {

              display: true,

              position: "bottom",

              labels: {

                font: {
                  size: 9
                },

                boxWidth: 7,

                boxHeight: 7,

                padding: 4

              }

            },

            tooltip: {

              callbacks: {

                title:
                  function(
                    tooltipItems
                  ) {

                    if (
                      !tooltipItems.length
                    ) {
                      return "";
                    }

                    return formatAxisDate(
                      tooltipItems[0]
                        .label,
                      period
                    );

                  },

                label:
                  function(
                    context
                  ) {

                    const value =
                      context.parsed.y;

                    if (
                      value === null ||
                      value === undefined
                    ) {
                      return "";
                    }

                    return (
                      context.dataset.label +
                      ": " +
                      Number(value)
                        .toFixed(1)
                    );

                  }

              }

            },

            boundaryMarker: {
              boundaryDate
            }

          },

          scales: {

            x: {

              ticks: {

                autoSkip: true,

                maxTicksLimit:
                  period === "5y"
                    ? 9
                    : 7,

                maxRotation: 0,

                minRotation: 0,

                font: {
                  size: 9
                },

                callback:
                  function(value) {

                    const label =
                      this.getLabelForValue(
                        value
                      );

                    return formatAxisDate(
                      label,
                      period
                    );

                  }

              },

              grid: {
                display: false
              }

            },

            y: {

              ticks: {

                font: {
                  size: 9
                },

                callback:
                  function(value) {

                    return Number(
                      value
                    ).toFixed(0);

                  }

              }

            }

          }

        }

      }
    );

  charts.push(chart);

  return chart;
}


/* ============================================================
   グラフエリア
============================================================ */

function createGraphArea(
  container,
  items,
  graphId,
  period,
  detailMode = false,
  groupMode = false
) {

  container.innerHTML = "";

  if (
    !items ||
    !items.length
  ) {

    container.innerHTML =
      '<div class="message">データがありません</div>';

    return;

  }

  /*
    赤▽をグラフ上部に表示するための領域
  */

  const note =
    document.createElement("div");

  note.className =
    "boundary-note";

  container.appendChild(
    note
  );

  const box =
    document.createElement("div");

  box.className =
    detailMode
      ? "detail-chart-box"
      : "chart-box";

  const canvas =
    document.createElement("canvas");

  box.appendChild(canvas);

  container.appendChild(box);

  let result;

  if (groupMode) {

    result =
      makeGroupDatasets(
        items,
        period
      );

  } else {

    result =
      makeStockDatasets(
        items,
        period,
        detailMode
      );

  }

  const chart =
    createChart(
      canvas,
      result.dates,
      result.datasets,
      period,
      detailMode
    );

  if (!chart) {

    container.innerHTML =
      '<div class="message">グラフデータがありません</div>';

    return;

  }

  /*
    赤▽の位置を上部に表示
  */

  if (
    period === "6m" ||
    period === "5y"
  ) {

    const boundary =
      getBoundaryDate(
        result.dates.map(
          date => ({
            date
          })
        ),
        period
      );

    if (boundary) {

      const boundaryTime =
        boundary.getTime();

      let nearestIndex = 0;
      let nearestDiff =
        Infinity;

      result.dates.forEach(
        (date, index) => {

          const diff =
            Math.abs(
              new Date(date)
                .getTime() -
              boundaryTime
            );

          if (
            diff < nearestDiff
          ) {

            nearestDiff = diff;
            nearestIndex = index;

          }

        }
      );

      const ratio =
        result.dates.length > 1
          ? nearestIndex /
            (result.dates.length - 1)
          : 0.5;

      const marker =
        document.createElement("span");

      marker.textContent =
        "▼";

      marker.style.left =
        (ratio * 100) + "%";

      note.appendChild(
        marker
      );

    }

  }

}


/* ============================================================
   業界ランキング
============================================================ */

function renderIndustryRanking(
  container,
  period
) {

  const dataset =
    DATA?.[period];

  const top =
    dataset
      ?.top_industries ||
    [];

  if (!top.length) {

    container.innerHTML =
      '<div class="message">業界データがありません</div>';

    return;

  }

  /*
    ランキングは
    「その期間の構成銘柄平均」
    で毎回計算
  */

  const ranking =
    top.map(
      item => {

        const name =
          item.industry;

        const stocks =
          dataset
            ?.industry_stocks
            ?.[name] ||
          [];

        return {

          name,

          change:
            calculateGroupChange(
              stocks,
              period
            ),

          stocks

        };

      }
    );

  ranking.sort(
    (a, b) =>
      Number(b.change || 0) -
      Number(a.change || 0)
  );

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "ranking";

  ranking.forEach(
    (item, index) => {

      const row =
        document.createElement("div");

      row.className =
        "ranking-row";

      row.innerHTML = `

        <div class="rank">
          ${index + 1}
        </div>

        <div class="name">
          ${item.name}
        </div>

        <div class="change ${changeClass(item.change)}">
          ${formatPercent(item.change)}
        </div>

      `;

      wrapper.appendChild(
        row
      );

      /*
        詳細
      */

      const detail =
        document.createElement("div");

      detail.className =
        "detail";

      detail.style.display =
        "none";

      const title =
        document.createElement("div");

      title.className =
        "detail-title";

      title.textContent =
        item.name;

      detail.appendChild(
        title
      );

      const graph =
        document.createElement("div");

      graph.className =
        "chart-area";

      detail.appendChild(
        graph
      );

      /*
        詳細グラフは
        1月基準を維持

        半年：
        from_1m_6m

        5年：
        from_1m_5y
      */

      createGraphArea(
        graph,
        item.stocks,
        "industry-detail-" +
          item.name,

/* ============================================================
   data.json読み込み
============================================================ */

async function loadData() {

  const updated =
    document.getElementById(
      "updated"
    );

  try {

    const response =
      await fetch(
        "./data.json?ts=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    if (!data["1m"]) {

      throw new Error(
        "1mデータがありません"
      );

    }

    if (!data["6m"]) {

      console.warn(
        "6mデータがありません"
      );

    }

    if (!data["5y"]) {

      console.warn(
        "5yデータがありません"
      );

    }

    if (
      data.updated_at
    ) {

      updated.textContent =
        "最終更新: " +
        data.updated_at;

    }

    renderApp(
      data
    );

  }

  catch(error) {

    console.error(
      error
    );

    updated.textContent =
      "データ読み込みエラー";

    document.getElementById(
      "app"
    ).innerHTML = `

      <section>

        <div class="message">

          データを読み込めませんでした。<br><br>

          <small>
            ${error.message}
          </small>

        </div>

      </section>

    `;

  }
}


/* ============================================================
   起動
============================================================ */

loadData();

</script>
