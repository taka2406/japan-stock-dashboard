<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>日本株モニター</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


  <style>

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      margin: 0;
      padding: 16px;

      background: #f5f5f7;

      color: #222;
    }


    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }


    .updated {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }


    .card {

      background: white;

      border-radius: 14px;

      padding: 16px;

      margin-bottom: 16px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

    }


    h2 {

      font-size: 18px;

      margin-top: 0;

      margin-bottom: 8px;

    }


    .description {

      font-size: 13px;

      color: #666;

      margin-top: 0;

      margin-bottom: 12px;

    }


    .row {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 10px 0;

      border-bottom:
        1px solid #eee;

    }


    .row:last-child {

      border-bottom: none;

    }


    .name {

      font-weight: 600;

    }


    .code {

      font-size: 12px;

      color: #888;

    }


    .up {

      color: #d33;

      font-weight: 700;

    }


    .down {

      color: #1677d2;

      font-weight: 700;

    }


    .flat {

      color: #666;

      font-weight: 700;

    }


    .loading {

      text-align: center;

      padding: 40px;

      color: #777;

    }


    .chart-container {

      position: relative;

      height: 330px;

      margin-top: 10px;

    }


    .legend-list {

      margin-top: 14px;

    }


    .legend-row {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 8px 0;

      border-bottom:
        1px solid #eee;

    }


    .legend-row:last-child {

      border-bottom: none;

    }


    .legend-left {

      display: flex;

      align-items: center;

      gap: 8px;

    }


    .color-dot {

      width: 10px;

      height: 10px;

      border-radius: 50%;

      flex-shrink: 0;

    }


    .note {

      background: #eef6ff;

      border-radius: 12px;

      padding: 12px;

      font-size: 13px;

      color: #444;

      line-height: 1.6;

      margin-bottom: 16px;

    }

  </style>

</head>


<body>


  <h1>📊 日本株モニター</h1>


  <div
    class="updated"
    id="updated"
  >
    読み込み中...
  </div>


  <div id="content">

    <div class="loading">

      データを読み込んでいます...

    </div>

  </div>



  <script>


    /*
    =====================
    色
    =====================
    */

    const chartColors = [

      "#e63946",
      "#f77f00",
      "#ffbe0b",
      "#70b23f",
      "#2a9d8f",
      "#219ebc",
      "#3a86ff",
      "#8338ec",
      "#ff006e",
      "#6c757d"

    ];



    /*
    =====================
    騰落率の色
    =====================
    */

    function percentClass(value) {

      if (value > 0) {

        return "up";

      }

      if (value < 0) {

        return "down";

      }

      return "flat";

    }



    /*
    =====================
    パーセント表示
    =====================
    */

    function formatPercent(value) {

      const sign =
        value > 0
          ? "+"
          : "";

      return (
        sign
        +
        Number(value).toFixed(2)
        +
        "%"
      );

    }



    /*
    =====================
    data.json取得
    =====================
    */

    fetch(
      "data.json",
      {
        cache: "no-store"
      }
    )

      .then(response => {

        if (!response.ok) {

          throw new Error(
            "data.jsonを取得できません"
          );

        }

        return response.json();

      })

      .then(data => {


        /*
        最終更新
        */

        document
          .getElementById("updated")
          .textContent =
          "最終更新: "
          +
          data.updated_at;


        const content =
          document.getElementById(
            "content"
          );


        let html = "";


        /*
        ==================================
        業界別平均グラフ
        ==================================
        */

        html += `

          <div class="card">

            <h2>
              📈 業界別平均の値動き
            </h2>

            <p class="description">

              直近1か月の騰落率が
              現在上位10業界

              <br>

              各業界の開始時点を
              100として表示

            </p>


            <div
              class="chart-container"
            >

              <canvas
                id="industryChart"
              ></canvas>

            </div>


            <div
              class="legend-list"
              id="industryLegend"
            ></div>

          </div>

        `;


        /*
        ==================================
        銘柄TOP10グラフ
        ==================================
        */

        html += `

          <div class="card">

            <h2>
              📈 1か月値上がり TOP10
            </h2>

            <p class="description">

              1か月前の株価を
              100として比較

            </p>


            <div
              class="chart-container"
            >

              <canvas
                id="stockChart"
              ></canvas>

            </div>


            <div
              class="legend-list"
              id="stockLegend"
            ></div>

          </div>

        `;


        /*
        説明
        */

        html += `

          <div class="note">

            💡 <b>グラフの見方</b>

            <br>

            ・すべての線は
            「1か月前＝100」
            として表示しています。

            <br>

            ・業界グラフは、
            その業界に登録されている
            銘柄の平均値動きです。

            <br>

            ・業界は現在の1か月騰落率で
            上位10業界だけを表示しています。

          </div>

        `;


        content.innerHTML = html;


        /*
        ==================================
        業界グラフ作成
        ==================================
        */

        if (

          data.top_industries

          &&

          data.top_industries.length > 0

        ) {


          /*
          日付ラベル
          */

          const industryLabels =

            data.top_industries[0]

            .history

            .map(
              item => item.date
            );


          /*
          データセット
          */

          const industryDatasets =

            data.top_industries

            .map(
              (item, index) => {

                return {

                  label:

                    item.industry

                    +

                    " "

                    +

                    formatPercent(
                      item.change_percent
                    ),


                  data:

                    item.history

                    .map(
                      point =>
                        point.value
                    ),


                  borderColor:

                    chartColors[
                      index
                      %
                      chartColors.length
                    ],


                  backgroundColor:

                    chartColors[
                      index
                      %
                      chartColors.length
                    ],


                  borderWidth: 2,


                  pointRadius: 0,


                  tension: 0.15

                };

              }
            );


          const industryCtx =

            document

            .getElementById(
              "industryChart"
            );


          new Chart(

            industryCtx,

            {

              type:
                "line",


              data: {

                labels:
                  industryLabels,


                datasets:
                  industryDatasets

              },


              options: {


                responsive:
                  true,


                maintainAspectRatio:
                  false,


                interaction: {

                  mode:
                    "index",


                  intersect:
                    false

                },


                plugins: {


                  legend: {

                    display:
                      false

                  },


                  tooltip: {

                    mode:
                      "index",


                    intersect:
                      false

                  }

                },


                scales: {


                  x: {

                    ticks: {

                      maxTicksLimit:
                        6

                    }

                  },


                  y: {

                    title: {

                      display:
                        true,


                      text:
                        "1か月前 = 100"

                    }

                  }

                }

              }

            }

          );


          /*
          業界凡例
          */

          const industryLegend =

            document

            .getElementById(
              "industryLegend"
            );


          let industryLegendHtml = "";


          data.top_industries

            .forEach(
              (item, index) => {


                const color =

                  chartColors[

                    index
                    %
                    chartColors.length

                  ];


                industryLegendHtml += `

                  <div
                    class="legend-row"
                  >


                    <div
                      class="legend-left"
                    >


                      <div

                        class="color-dot"

                        style="
                          background:
                          ${color}
                        "

                      ></div>


                      <div>


                        <div
                          class="name"
                        >

                          ${index + 1}.
                          ${item.industry}

                        </div>


                      </div>


                    </div>


                    <div

                      class="${percentClass(
                        item.change_percent
                      )}"

                    >

                      ${formatPercent(
                        item.change_percent
                      )}

                    </div>


                  </div>

                `;


              }

            );


          industryLegend.innerHTML =

            industryLegendHtml;

        }



        /*
        ==================================
        銘柄TOP10グラフ
        ==================================
        */

        if (

          data.top_gainers

          &&

          data.top_gainers.length > 0

        ) {


          /*
          日付ラベル
          */

          const stockLabels =

            data.top_gainers[0]

            .history

            .map(
              item => item.date
            );


          /*
          データセット
          */

          const stockDatasets =

            data.top_gainers

            .map(
              (item, index) => {

                return {

                  label:

                    item.name

                    +

                    " "

                    +

                    formatPercent(
                      item.change_percent
                    ),


                  data:

                    item.history

                    .map(
                      point =>
                        point.value
                    ),


                  borderColor:

                    chartColors[
                      index
                      %
                      chartColors.length
                    ],


                  backgroundColor:

                    chartColors[
                      index
                      %
                      chartColors.length
                    ],


                  borderWidth: 2,


                  pointRadius: 0,


                  tension: 0.15

                };

              }
            );


          const stockCtx =

            document

            .getElementById(
              "stockChart"
            );


          new Chart(

            stockCtx,

            {

              type:
                "line",


              data: {

                labels:
                  stockLabels,


                datasets:
                  stockDatasets

              },


              options: {


                responsive:
                  true,


                maintainAspectRatio:
                  false,


                interaction: {

                  mode:
                    "index",


                  intersect:
                    false

                },


                plugins: {


                  legend: {

                    display:
                      false

                  },


                  tooltip: {

                    mode:
                      "index",


                    intersect:
                      false

                  }

                },


                scales: {


                  x: {

                    ticks: {

                      maxTicksLimit:
                        6

                    }

                  },


                  y: {

                    title: {

                      display:
                        true,


                      text:
                        "1か月前 = 100"

                    }

                  }

                }

              }

            }

          );


          /*
          銘柄凡例
          */

          const stockLegend =

            document

            .getElementById(
              "stockLegend"
            );


          let stockLegendHtml = "";


          data.top_gainers

            .forEach(
              (item, index) => {


                const color =

                  chartColors[

                    index
                    %
                    chartColors.length

                  ];


                stockLegendHtml += `

                  <div
                    class="legend-row"
                  >


                    <div
                      class="legend-left"
                    >


                      <div

                        class="color-dot"

                        style="
                          background:
                          ${color}
                        "

                      ></div>


                      <div>


                        <div
                          class="name"
                        >

                          ${index + 1}.
                          ${item.name}

                        </div>


                        <div
                          class="code"
                        >

                          ${item.code}

                          ・

                          ${item.industry}

                        </div>


                      </div>


                    </div>


                    <div

                      class="${percentClass(
                        item.change_percent
                      )}"

                    >

                      ${formatPercent(
                        item.change_percent
                      )}

                    </div>


                  </div>

                `;


              }

            );


          stockLegend.innerHTML =

            stockLegendHtml;

        }


      })


      .catch(error => {


        document

          .getElementById(
            "content"
          )

          .innerHTML = `

            <div
              class="loading"
            >

              データの読み込みに失敗しました

            </div>

          `;


        console.error(
          error
        );

      });


  </script>


</body>

</html>
