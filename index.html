<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">

  <title>日本株ダッシュボード</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #ddd;
      padding: 12px 14px;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
    }

    #updated {
      margin-top: 4px;
      font-size: 11px;
      color: #777;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px;
    }

    section {
      background: white;
      border-radius: 12px;
      margin-bottom: 14px;
      padding: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    section h2 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 300px;
    }

    .detail-chart-box {
      position: relative;
      width: 100%;
      height: 270px;
    }

    @media (max-width: 600px) {
      .chart-box {
        height: 300px;
      }

      .detail-chart-box {
        height: 250px;
      }
    }

    .period-buttons {
      display: flex;
      gap: 5px;
      margin: 4px 0 7px;
    }

    .period-button {
      border: 1px solid #ccc;
      background: #fff;
      color: #555;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 11px;
      line-height: 1.2;
      cursor: pointer;
    }

    .period-button.active {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    .ranking {
      margin-top: 8px;
    }

    .ranking-row {
      display: flex;
      align-items: center;
      min-height: 38px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      user-select: none;
    }

    .ranking-row:last-child {
      border-bottom: none;
    }

    .rank {
      width: 34px;
      text-align: center;
      font-size: 13px;
      color: #777;
      flex-shrink: 0;
    }

    .name {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .change {
      width: 72px;
      text-align: right;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .up {
      color: #d60000;
    }

    .down {
      color: #0066cc;
    }

    .detail {
      background: #fafafa;
      padding: 8px;
      border-radius: 8px;
      margin: 4px 0 8px;
    }

    .detail-title {
      font-size: 15px;
      font-weight: 700;
      margin: 2px 0 5px;
    }

    .stock-row {
      display: flex;
      align-items: center;
      min-height: 34px;
      border-bottom: 1px solid #e8e8e8;
    }

    .stock-row:last-child {
      border-bottom: none;
    }

    .stock-code {
      width: 50px;
      color: #888;
      font-size: 11px;
      flex-shrink: 0;
    }

    .stock-name {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stock-change {
      width: 68px;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message {
      padding: 20px 10px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

    .section-subtitle {
      font-size: 11px;
      color: #888;
      margin: -3px 0 7px;
    }
  </style>

</head>

<body>

<header>
  <h1>日本株ダッシュボード</h1>
  <div id="updated">データ読み込み中...</div>
</header>

<main id="app">
  <div class="message">データ読み込み中...</div>
</main>

<script>

let DATA = null;

/* 現在の期間
   グラフごとに個別に持つ */
const chartPeriods = {};

const PERIOD_LABEL = {
  "1m": "1月",
  "6m": "半年",
  "5y": "5年"
};

const PERIOD_ORDER = ["1m", "6m", "5y"];


/* -----------------------------
   共通
----------------------------- */

function periodLabel(period) {
  return PERIOD_LABEL[period] || period;
}

function formatPercent(value) {
  if (value === null || value === undefined || Number.isNaN(value)) {
    return "-";
  }

  const n = Number(value) * 100;
  const sign = n > 0 ? "+" : "";

  return sign + n.toFixed(1) + "%";
}

function changeClass(value) {
  return Number(value) >= 0 ? "up" : "down";
}


/* -----------------------------
   期間ボタン
----------------------------- */

function createPeriodButtons(id, currentPeriod, onChange) {

  const div = document.createElement("div");
  div.className = "period-buttons";

  PERIOD_ORDER.forEach(period => {

    const button = document.createElement("button");

    button.className =
      "period-button" +
      (period === currentPeriod ? " active" : "");

    button.textContent = PERIOD_LABEL[period];

    button.addEventListener("click", () => {
      onChange(period);
    });

    div.appendChild(button);
  });

  return div;
}


/* -----------------------------
   日付表示
----------------------------- */

function formatAxisDate(dateString, period) {

  const d = new Date(dateString);

  if (Number.isNaN(d.getTime())) {
    return dateString;
  }

  const year = String(d.getFullYear()).slice(-2);
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");

  if (period === "5y") {
    return `${year}/${month}`;
  }

  return `${month}/${day}`;
}


/* -----------------------------
   赤い ▼ マーカー
----------------------------- */

const boundaryMarkerPlugin = {

  id: "boundaryMarker",

  afterDatasetsDraw(chart, args, pluginOptions) {

    const boundaryDate = pluginOptions?.boundaryDate;

    if (!boundaryDate) {
      return;
    }

    const labels = chart.data.labels || [];

    if (!labels.length) {
      return;
    }

    const targetTime = new Date(boundaryDate).getTime();

    let bestIndex = -1;
    let bestDiff = Infinity;

    labels.forEach((label, index) => {

      const t = new Date(label).getTime();

      if (Number.isNaN(t)) {
        return;
      }

      const diff = Math.abs(t - targetTime);

      if (diff < bestDiff) {
        bestDiff = diff;
        bestIndex = index;
      }
    });

    if (bestIndex < 0) {
      return;
    }

    const meta = chart.getDatasetMeta(0);

    if (!meta || !meta.data || !meta.data[bestIndex]) {
      return;
    }

    const point = meta.data[bestIndex];

    const ctx = chart.ctx;

    ctx.save();

    ctx.fillStyle = "#d60000";

    const x = point.x;
    const y = chart.chartArea.top + 2;

    ctx.beginPath();

    ctx.moveTo(x, y);
    ctx.lineTo(x - 6, y);
    ctx.lineTo(x, y + 9);
    ctx.lineTo(x + 6, y);

    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
};

Chart.register(boundaryMarkerPlugin);


/* -----------------------------
   マーカーの基準日
----------------------------- */

function getBoundaryDate(history, period) {

  if (!history || history.length === 0) {
    return null;
  }

  if (period === "6m") {

    // 1か月前
    const newest = new Date(history[history.length - 1].date);

    const d = new Date(newest);
    d.setMonth(d.getMonth() - 1);

    return d.toISOString();
  }

  if (period === "5y") {

    // 半年前
    const newest = new Date(history[history.length - 1].date);

    const d = new Date(newest);
    d.setMonth(d.getMonth() - 6);

    return d.toISOString();
  }

  return null;
}


/* -----------------------------
   グラフ用データ
----------------------------- */

function makeDatasets(items, historyKey) {

  const dateMap = new Map();

  items.forEach(item => {

    const history =
      item?.periods?.[historyKey]?.history ||
      item?.history ||
      [];

    history.forEach(point => {

      if (!dateMap.has(point.date)) {
        dateMap.set(point.date, {});
      }

      dateMap.get(point.date)[item.name] = point.value;
    });
  });

  const dates = Array.from(dateMap.keys()).sort();

  const datasets = items.map(item => {

    return {
      label: item.name,
      data: dates.map(date => {
        return dateMap.get(date)?.[item.name] ?? null;
      }),
      borderWidth: 1.5,
      pointRadius: 0,
      tension: 0.15,
      spanGaps: true
    };
  });

  return {
    dates,
    datasets
  };
}


/* -----------------------------
   グラフ生成
----------------------------- */

function createLineChart(canvas, items, period, isDetail = false) {

  if (!items || items.length === 0) {
    return null;
  }

  const result = makeDatasets(items, period);

  if (!result.dates.length) {
    return null;
  }

  const labels = result.dates;

  const datasets = result.datasets;

  const boundaryDate =
    getBoundaryDate(
      items[0]?.periods?.[period]?.history || [],
      period
    );

  const ctx = canvas.getContext("2d");

  return new Chart(ctx, {

    type: "line",

    data: {
      labels,

      datasets
    },

    options: {

      responsive: true,

      maintainAspectRatio: false,

      interaction: {
        mode: "index",
        intersect: false
      },

      plugins: {

        legend: {

          display: true,

          position: "bottom",

          labels: {

            // 凡例をコンパクト化
            font: {
              size: 9
            },

            // 色の四角を小さく
            boxWidth: 7,
            boxHeight: 7,

            padding: 5,

            usePointStyle: false
          }
        },

        tooltip: {

          callbacks: {

            title: function(items) {

              if (!items.length) {
                return "";
              }

              return formatAxisDate(
                items[0].label,
                period
              );
            },

            label: function(context) {

              const value = context.parsed.y;

              if (value === null || value === undefined) {
                return "";
              }

              return `${context.dataset.label}: ${value.toFixed(1)}`;
            }
          }
        },

        boundaryMarker: {
          boundaryDate
        }
      },

      scales: {

        x: {

          ticks: {

            autoSkip: true,

            maxTicksLimit:
              period === "1m"
                ? 8
                : period === "6m"
                  ? 8
                  : 10,

            maxRotation: 0,

            minRotation: 0,

            font: {
              size: 9
            },

            callback: function(value) {

              const label =
                this.getLabelForValue(value);

              return formatAxisDate(
                label,
                period
              );
            }
          },

          grid: {
            display: false
          }
        },

        y: {

          ticks: {

            font: {
              size: 9
            },

            callback: function(value) {
              return Number(value).toFixed(0);
            }
          }
        }
      }
    }
  });
}


/* -----------------------------
   グラフ＋期間ボタン
----------------------------- */

function createGraphArea(
  container,
  items,
  graphId,
  defaultPeriod,
  isDetail = false
) {

  if (!items || !items.length) {
    container.innerHTML =
      '<div class="message">データがありません</div>';
    return;
  }

  if (!chartPeriods[graphId]) {
    chartPeriods[graphId] = defaultPeriod;
  }

  let chart = null;

  function render() {

    container.innerHTML = "";

    const period = chartPeriods[graphId];

    const buttons =
      createPeriodButtons(
        graphId,
        period,
        newPeriod => {

          chartPeriods[graphId] = newPeriod;

          render();
        }
      );

    container.appendChild(buttons);

    const box = document.createElement("div");

    box.className =
      isDetail
        ? "detail-chart-box"
        : "chart-box";

    const canvas = document.createElement("canvas");

    box.appendChild(canvas);

    container.appendChild(box);

    chart =
      createLineChart(
        canvas,
        items,
        period,
        isDetail
      );
  }

  render();
}


/* -----------------------------
   業界ランキング
----------------------------- */

function renderIndustryRanking(container, dataset) {

  const ranking =
    dataset?.top_industries || [];

  if (!ranking.length) {

    container.innerHTML =
      '<div class="message">業界データがありません</div>';

    return;
  }

  const wrapper =
    document.createElement("div");

  wrapper.className = "ranking";

  ranking.forEach((item, index) => {

    const row =
      document.createElement("div");

    row.className = "ranking-row";

    row.innerHTML = `
      <div class="rank">${index + 1}</div>
      <div class="name">${item.name}</div>
      <div class="change ${changeClass(item.change)}">
        ${formatPercent(item.change)}
      </div>
    `;

    wrapper.appendChild(row);

    const detail =
      document.createElement("div");

    detail.className = "detail";

    detail.style.display = "none";

    const detailTitle =
      document.createElement("div");

    detailTitle.className = "detail-title";

    detailTitle.textContent =
      `${item.name}`;

    detail.appendChild(detailTitle);

    const graphContainer =
      document.createElement("div");

    detail.appendChild(graphContainer);

    const stocks =
      dataset.industry_stocks?.[item.name] || [];

    const graphId =
      `industry-${item.name}`;

    createGraphArea(
      graphContainer,
      stocks,
      graphId,
      "1m",
      true
    );

    const stockRanking =
      document.createElement("div");

    stockRanking.className =
      "ranking";

    const sortedStocks =
      [...stocks].sort(
        (a, b) =>
          Number(b.change || 0) -
          Number(a.change || 0)
      );

    sortedStocks.forEach((stock, stockIndex) => {

      const stockRow =
        document.createElement("div");

      stockRow.className =
        "stock-row";

      stockRow.innerHTML = `
        <div class="stock-code">
          ${stock.code || ""}
        </div>

        <div class="stock-name">
          ${stock.name || ""}
        </div>

        <div class="stock-change ${changeClass(stock.change)}">
          ${formatPercent(stock.change)}
        </div>
      `;

      stockRanking.appendChild(stockRow);
    });

    detail.appendChild(stockRanking);

    wrapper.appendChild(detail);

    row.addEventListener("click", () => {

      detail.style.display =
        detail.style.display === "none"
          ? "block"
          : "none";
    });
  });

  container.appendChild(wrapper);
}


/* -----------------------------
   テーマランキング
----------------------------- */

function renderThemeRanking(container, dataset) {

  const ranking =
    dataset?.top_themes || [];

  if (!ranking.length) {

    container.innerHTML =
      '<div class="message">テーマデータがありません</div>';

    return;
  }

  const wrapper =
    document.createElement("div");

  wrapper.className = "ranking";

  ranking.forEach((item, index) => {

    const row =
      document.createElement("div");

    row.className = "ranking-row";

    row.innerHTML = `
      <div class="rank">${index + 1}</div>
      <div class="name">${item.name}</div>
      <div class="change ${changeClass(item.change)}">
        ${formatPercent(item.change)}
      </div>
    `;

    wrapper.appendChild(row);

    const detail =
      document.createElement("div");

    detail.className = "detail";

    detail.style.display = "none";

    const title =
      document.createElement("div");

    title.className = "detail-title";

    title.textContent =
      `${item.name}`;

    detail.appendChild(title);

    const graphContainer =
      document.createElement("div");

    detail.appendChild(graphContainer);

    const stocks =
      dataset.theme_stocks?.[item.name] || [];

    createGraphArea(
      graphContainer,
      stocks,
      `theme-${item.name}`,
      "1m",
      true
    );

    const stockRanking =
      document.createElement("div");

    stockRanking.className =
      "ranking";

    const sortedStocks =
      [...stocks].sort(
        (a, b) =>
          Number(b.change || 0) -
          Number(a.change || 0)
      );

    sortedStocks.forEach(stock => {

      const stockRow =
        document.createElement("div");

      stockRow.className =
        "stock-row";

      stockRow.innerHTML = `
        <div class="stock-code">
          ${stock.code || ""}
        </div>

        <div class="stock-name">
          ${stock.name || ""}
        </div>

        <div class="stock-change ${changeClass(stock.change)}">
          ${formatPercent(stock.change)}
        </div>
      `;

      stockRanking.appendChild(stockRow);
    });

    detail.appendChild(stockRanking);

    wrapper.appendChild(detail);

    row.addEventListener("click", () => {

      detail.style.display =
        detail.style.display === "none"
          ? "block"
          : "none";
    });
  });

  container.appendChild(wrapper);
}


/* -----------------------------
   値上がり銘柄
----------------------------- */

function renderTopGainers(container, dataset) {

  const ranking =
    dataset?.top_gainers || [];

  if (!ranking.length) {

    container.innerHTML =
      '<div class="message">値上がり銘柄データがありません</div>';

    return;
  }

  const wrapper =
    document.createElement("div");

  wrapper.className = "ranking";

  ranking.slice(0, 10).forEach((item, index) => {

    const row =
      document.createElement("div");

    row.className = "ranking-row";

    row.innerHTML = `
      <div class="rank">${index + 1}</div>

      <div class="name">
        ${item.name || ""}
        ${item.code ? ` <span style="color:#999;font-size:10px">${item.code}</span>` : ""}
      </div>

      <div class="change ${changeClass(item.change)}">
        ${formatPercent(item.change)}
      </div>
    `;

    wrapper.appendChild(row);
  });

  container.appendChild(wrapper);
}


/* -----------------------------
   メイン表示
----------------------------- */

function renderApp(data) {

  DATA = data;

  const app =
    document.getElementById("app");

  app.innerHTML = "";

  const period = "1m";

  /* 業界TOP10 */

  const industryTop =
    document.createElement("section");

  industryTop.innerHTML =
    "<h2>業界 TOP10</h2>" +
    '<div class="section-subtitle">業界の推移</div>';

  const industryTopGraph =
    document.createElement("div");

  industryTop.appendChild(
    industryTopGraph
  );

  const industryItems =
    data?.[period]?.top_industries || [];

  createGraphArea(
    industryTopGraph,
    industryItems,
    "industry-top",
    "1m",
    false
  );

  app.appendChild(industryTop);


  /* 業界ランキング */

  const industryRanking =
    document.createElement("section");

  industryRanking.innerHTML =
    "<h2>業界ランキング</h2>" +
    '<div class="section-subtitle">タップすると業界内の銘柄を表示</div>';

  const industryRankingContainer =
    document.createElement("div");

  industryRanking.appendChild(
    industryRankingContainer
  );

  renderIndustryRanking(
    industryRankingContainer,
    data[period]
  );

  app.appendChild(industryRanking);


  /* テーマTOP10 */

  const themeTop =
    document.createElement("section");

  themeTop.innerHTML =
    "<h2>🔥 テーマ TOP10</h2>" +
    '<div class="section-subtitle">テーマの推移</div>';

  const themeTopGraph =
    document.createElement("div");

  themeTop.appendChild(
    themeTopGraph
  );

  const themeItems =
    data?.[period]?.top_themes || [];

  createGraphArea(
    themeTopGraph,
    themeItems,
    "theme-top",
    "1m",
    false
  );

  app.appendChild(themeTop);


  /* テーマランキング */

  const themeRanking =
    document.createElement("section");

  themeRanking.innerHTML =
    "<h2>テーマランキング</h2>" +
    '<div class="section-subtitle">タップするとテーマ内の銘柄を表示</div>';

  const themeRankingContainer =
    document.createElement("div");

  themeRanking.appendChild(
    themeRankingContainer
  );

  renderThemeRanking(
    themeRankingContainer,
    data[period]
  );

  app.appendChild(themeRanking);


  /* 値上がり */

  const gainers =
    document.createElement("section");

  gainers.innerHTML =
    "<h2>1か月値上がり銘柄 TOP10</h2>";

  const gainersContainer =
    document.createElement("div");

  gainers.appendChild(
    gainersContainer
  );

  renderTopGainers(
    gainersContainer,
    data[period]
  );

  app.appendChild(gainers);
}


/* -----------------------------
   データ読み込み
----------------------------- */

async function loadData() {

  const updated =
    document.getElementById("updated");

  try {

    const response =
      await fetch(
        "./data.json?ts=" + Date.now(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const data =
      await response.json();

    if (!data["1m"]) {
      throw new Error(
        "1mデータがありません"
      );
    }

    if (data.updated_at) {

      updated.textContent =
        "最終更新: " +
        data.updated_at;
    }

    renderApp(data);

  } catch (error) {

    console.error(error);

    updated.textContent =
      "データ読み込みエラー";

    document.getElementById("app").innerHTML = `
      <section>
        <div class="message">
          データを読み込めませんでした。<br>
          data.json の配置を確認してください。<br><br>
          <small>${error.message}</small>
        </div>
      </section>
    `;
  }
}

loadData();

</script>

</body>
</html>
