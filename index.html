<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>日本株ダッシュボード</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;

    background: #f5f5f5;
    color: #222;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;

    background: white;
    border-bottom: 1px solid #ddd;

    padding: 14px 12px 12px;
}

h1 {
    margin: 0 0 10px;
    font-size: 21px;
    font-weight: 700;
}

.updated {
    font-size: 12px;
    color: #777;
    margin-bottom: 12px;
}

.period-selector {
    display: flex;
    gap: 8px;
}

.period-button {
    flex: 1;

    border: 1px solid #ccc;
    background: #fff;

    border-radius: 10px;

    padding: 9px 0;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
}

.period-button.active {
    background: #222;
    color: white;
    border-color: #222;
}

main {
    max-width: 900px;
    margin: 0 auto;
    padding: 12px;
}

.section {
    background: white;
    border-radius: 14px;

    padding: 14px;
    margin-bottom: 14px;

    box-shadow:
        0 1px 4px rgba(0,0,0,0.06);
}

.section-title {
    margin: 0 0 12px;

    font-size: 18px;
    font-weight: 700;
}

.section-subtitle {
    font-size: 12px;
    color: #777;
    margin-top: -6px;
    margin-bottom: 10px;
}

.chart-container {
    position: relative;
    width: 100%;
    height: 280px;
}

.detail-chart-container {
    position: relative;
    width: 100%;
    height: 260px;
}

.detail-period-selector {
    display: flex;
    gap: 6px;

    margin-bottom: 10px;
}

.detail-period-button {
    border: 1px solid #ccc;
    background: white;

    border-radius: 8px;

    padding: 6px 12px;

    font-size: 12px;
    font-weight: 600;
}

.detail-period-button.active {
    background: #222;
    color: white;
    border-color: #222;
}

.ranking {
    display: flex;
    flex-direction: column;
}

.ranking-row {
    border-bottom: 1px solid #eee;
}

.ranking-row:last-child {
    border-bottom: none;
}

.ranking-button {
    width: 100%;

    border: none;
    background: white;

    padding: 13px 4px;

    display: flex;
    align-items: center;

    cursor: pointer;

    text-align: left;
}

.rank {
    width: 34px;

    font-size: 14px;
    font-weight: 700;

    color: #777;
}

.rank.top {
    color: #222;
}

.rank-name {
    flex: 1;

    font-size: 15px;
    font-weight: 600;

    min-width: 0;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.rank-change {
    width: 78px;

    text-align: right;

    font-size: 14px;
    font-weight: 700;
}

.positive {
    color: #d60000;
}

.negative {
    color: #0066cc;
}

.neutral {
    color: #666;
}

.arrow {
    width: 24px;

    text-align: right;

    color: #aaa;
    font-size: 14px;
}

.detail {
    display: none;

    background: #fafafa;

    padding: 12px;

    border-top: 1px solid #eee;
}

.detail.open {
    display: block;
}

.detail-title {
    margin: 0 0 10px;

    font-size: 16px;
    font-weight: 700;
}

.stock-ranking {
    margin-top: 12px;
}

.stock-row {
    display: flex;
    align-items: center;

    padding: 9px 2px;

    border-bottom: 1px solid #eee;
}

.stock-row:last-child {
    border-bottom: none;
}

.stock-rank {
    width: 30px;

    font-size: 12px;
    color: #888;
}

.stock-name {
    flex: 1;

    font-size: 14px;

    min-width: 0;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.stock-code {
    font-size: 11px;
    color: #999;

    margin-left: 5px;
}

.stock-price {
    width: 70px;

    text-align: right;

    font-size: 12px;
    color: #555;
}

.stock-change {
    width: 70px;

    text-align: right;

    font-size: 13px;
    font-weight: 700;
}

.top-stock {
    display: flex;
    align-items: center;

    padding: 10px 2px;

    border-bottom: 1px solid #eee;
}

.top-stock:last-child {
    border-bottom: none;
}

.top-stock-rank {
    width: 34px;

    font-size: 14px;
    font-weight: 700;
}

.top-stock-name {
    flex: 1;

    font-size: 14px;
    font-weight: 600;

    min-width: 0;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.top-stock-change {
    width: 80px;

    text-align: right;

    font-size: 14px;
    font-weight: 700;
}

.loading {
    text-align: center;

    padding: 50px 10px;

    color: #777;
}

.error {
    text-align: center;

    padding: 40px 10px;

    color: #c00;
}

.no-data {
    padding: 20px 5px;

    text-align: center;

    color: #888;

    font-size: 13px;
}

.small-note {
    margin-top: 10px;

    font-size: 11px;

    color: #999;

    line-height: 1.5;
}

@media (min-width: 700px) {

    .chart-container {
        height: 330px;
    }

    .detail-chart-container {
        height: 300px;
    }

}

</style>
</head>


<body>

<header>

    <h1>日本株ダッシュボード</h1>

    <div id="updated"
         class="updated">
        データ読み込み中...
    </div>

    <div class="period-selector">

        <button
            class="period-button active"
            data-period="1m">
            1月
        </button>

        <button
            class="period-button"
            data-period="6m">
            半年
        </button>

        <button
            class="period-button"
            data-period="5y">
            5年
        </button>

    </div>

</header>


<main id="app">

    <div class="loading">
        株価データを読み込んでいます...
    </div>

</main>


<script>

/* ============================================================
   基本設定
============================================================ */

let DATA = null;

let selectedPeriod = "1m";

let chartInstances = [];

let detailChartCounter = 0;


/* ============================================================
   期間名
============================================================ */

function periodLabel(period) {

    if (period === "1m") {
        return "1か月";
    }

    if (period === "6m") {
        return "半年";
    }

    if (period === "5y") {
        return "5年";
    }

    return "";
}


/* ============================================================
   期間の説明
============================================================ */

function periodDescription(period) {

    if (period === "1m") {
        return "日足・1か月前を100";
    }

    if (period === "6m") {
        return "週足・半年間の変化";
    }

    if (period === "5y") {
        return "月足・5年間の変化";
    }

    return "";
}


/* ============================================================
   増減率表示
============================================================ */

function formatChange(value) {

    const num = Number(value || 0);

    if (num > 0) {
        return "+" + num.toFixed(2) + "%";
    }

    return num.toFixed(2) + "%";
}


function changeClass(value) {

    const num = Number(value || 0);

    if (num > 0) {
        return "positive";
    }

    if (num < 0) {
        return "negative";
    }

    return "neutral";
}


/* ============================================================
   Chart.js の既存グラフを破棄
============================================================ */

function destroyCharts() {

    chartInstances.forEach(chart => {

        try {
            chart.destroy();
        } catch (e) {}

    });

    chartInstances = [];
}


/* ============================================================
   historyからChart.js用データを作る
============================================================ */

function historyToMap(history) {

    const map = {};

    if (!history) {
        return map;
    }

    history.forEach(point => {
        map[point.date] = point.value;
    });

    return map;
}


function makeDatasets(items) {

    const dateSet = new Set();

    items.forEach(item => {

        const history = item.history || [];

        history.forEach(point => {
            dateSet.add(point.date);
        });

    });

    const labels = Array.from(dateSet).sort(
        (a, b) => {

            const da = new Date(
                a.replace(/\//g, "-")
            );

            const db = new Date(
                b.replace(/\//g, "-")
            );

            return da - db;
        }
    );


    const datasets = items.map(
        (item, index) => {

            const map = historyToMap(
                item.history
            );

            return {

                label:
                    item.name ||
                    item.industry ||
                    item.theme ||
                    "",

                data: labels.map(
                    date => map[date] ?? null
                ),

                borderWidth: 2,

                pointRadius: 0,

                tension: 0.15,

                spanGaps: true

            };

        }
    );


    return {
        labels,
        datasets
    };
}


/* ============================================================
   グラフ作成
============================================================ */

function createLineChart(
    canvasId,
    items,
    title
) {

    const canvas =
        document.getElementById(canvasId);

    if (!canvas) {
        return;
    }

    const chartData =
        makeDatasets(items);

    const chart =
        new Chart(
            canvas.getContext("2d"),
            {

                type: "line",

                data: chartData,

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    interaction: {
                        mode: "nearest",
                        intersect: false
                    },

                    plugins: {

                        legend: {
                            display: true,
                            position: "bottom"
                        },

                        tooltip: {

                            callbacks: {

                                label:
                                    function(context) {

                                        const value =
                                            context.parsed.y;

                                        if (
                                            value === null ||
                                            value === undefined
                                        ) {
                                            return "";
                                        }

                                        return (
                                            context.dataset.label
                                            + ": "
                                            + value.toFixed(1)
                                        );

                                    }

                            }

                        }

                    },

                    scales: {

                        x: {

                            ticks: {
                                maxTicksLimit: 7
                            }

                        },

                        y: {

                            title: {
                                display: true,
                                text: "基準値 = 100"
                            }

                        }

                    }

                }

            }
        );

    chartInstances.push(chart);
}


/* ============================================================
   共通ランキングHTML
============================================================ */

function rankingRows(
    items,
    type
) {

    if (!items || items.length === 0) {

        return `
            <div class="no-data">
                データがありません
            </div>
        `;

    }

    return items.map(
        (item, index) => {

            const name =
                type === "industry"
                    ? item.industry
                    : item.theme;

            return `

                <div class="ranking-row">

                    <button
                        class="ranking-button"
                        data-type="${type}"
                        data-index="${index}">

                        <div class="
                            rank
                            ${index < 3 ? "top" : ""}
                        ">
                            ${index + 1}
                        </div>

                        <div class="rank-name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="
                            rank-change
                            ${changeClass(item.change_percent)}
                        ">
                            ${formatChange(
                                item.change_percent
                            )}
                        </div>

                        <div class="arrow">
                            ›
                        </div>

                    </button>

                    <div
                        class="detail"
                        id="${type}-detail-${index}">
                    </div>

                </div>

            `;

        }
    ).join("");
}


/* ============================================================
   HTMLエスケープ
============================================================ */

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================================
   業界TOP10
============================================================ */

function renderIndustryTop10(dataset) {

    const items =
        dataset.top_industries || [];

    return `

        <section class="section">

            <h2 class="section-title">
                業界 TOP10
            </h2>

            <div class="section-subtitle">
                ${periodDescription(selectedPeriod)}
            </div>

            <div class="chart-container">

                <canvas id="industryTopChart"></canvas>

            </div>

        </section>

    `;

}


/* ============================================================
   業界ランキング
============================================================ */

function renderIndustryRanking(dataset) {

    return `

        <section class="section">

            <h2 class="section-title">
                業界ランキング
            </h2>

            <div class="section-subtitle">
                ${periodDescription(selectedPeriod)}
                ・タップすると業界の銘柄を表示
            </div>

            <div class="ranking">

                ${rankingRows(
                    dataset.industries || [],
                    "industry"
                )}

            </div>

        </section>

    `;

}


/* ============================================================
   テーマTOP10
============================================================ */

function renderThemeTop10(dataset) {

    const items =
        dataset.top_themes || [];

    return `

        <section class="section">

            <h2 class="section-title">
                🔥 テーマ TOP10
            </h2>

            <div class="section-subtitle">
                ${periodDescription(selectedPeriod)}
            </div>

            <div class="chart-container">

                <canvas id="themeTopChart"></canvas>

            </div>

        </section>

    `;

}


/* ============================================================
   テーマランキング
============================================================ */

function renderThemeRanking(dataset) {

    return `

        <section class="section">

            <h2 class="section-title">
                テーマランキング
            </h2>

            <div class="section-subtitle">
                ${periodDescription(selectedPeriod)}
                ・タップするとテーマの銘柄を表示
            </div>

            <div class="ranking">

                ${rankingRows(
                    dataset.themes || [],
                    "theme"
                )}

            </div>

        </section>

    `;

}


/* ============================================================
   値上がり銘柄TOP10
============================================================ */

function renderTopGainers(dataset) {

    const items =
        dataset.top_gainers || [];

    let rows = "";

    if (items.length === 0) {

        rows = `
            <div class="no-data">
                データがありません
            </div>
        `;

    } else {

        rows = items.map(
            (item, index) => {

                return `

                    <div class="top-stock">

                        <div class="top-stock-rank">
                            ${index + 1}
                        </div>

                        <div class="top-stock-name">

                            ${escapeHtml(
                                item.name
                            )}

                            <span class="stock-code">
                                ${escapeHtml(
                                    item.code
                                )}
                            </span>

                        </div>

                        <div class="
                            top-stock-change
                            ${changeClass(
                                item.change_percent
                            )}
                        ">
                            ${formatChange(
                                item.change_percent
                            )}
                        </div>

                    </div>

                `;

            }
        ).join("");

    }


    return `

        <section class="section">

            <h2 class="section-title">
                1か月値上がり銘柄 TOP10
            </h2>

            <div class="section-subtitle">
                現在選択中：
                ${periodLabel(selectedPeriod)}
            </div>

            ${rows}

        </section>

    `;

}


/* ============================================================
   詳細グラフの期間ボタン
============================================================ */

function getDetailPeriods() {

    if (selectedPeriod === "1m") {

        return [
            "1m",
            "from_1m_6m",
            "from_1m_5y"
        ];

    }

    if (selectedPeriod === "6m") {

        return [
            "6m",
            "from_6m_5y"
        ];

    }

    return [
        "5y"
    ];

}


/* ============================================================
   詳細グラフのボタン表示名
============================================================ */

function detailPeriodLabel(period) {

    if (period === "1m") {
        return "1月";
    }

    if (period === "6m") {
        return "半年";
    }

    if (period === "5y") {
        return "5年";
    }

    if (period === "from_1m_6m") {
        return "半年";
    }

    if (period === "from_1m_5y") {
        return "5年";
    }

    if (period === "from_6m_5y") {
        return "5年";
    }

    return "";
}


/* ============================================================
   詳細グラフに使うhistory
============================================================ */

function getStockHistory(
    stock,
    detailPeriod
) {

    if (!stock) {
        return [];
    }

    const periods =
        stock.periods || {};

    if (
        detailPeriod === "1m" ||
        detailPeriod === "6m" ||
        detailPeriod === "5y"
    ) {

        return (
            periods[detailPeriod]?.history
            || stock.history
            || []
        );

    }

    return (
        periods[detailPeriod]?.history
        || []
    );

}


/* ============================================================
   詳細グラフ期間ボタン
============================================================ */

function renderDetailPeriodButtons(
    detailId,
    currentPeriod
) {

    const periods =
        getDetailPeriods();

    // 全体が5年の場合はボタンなし
    if (periods.length <= 1) {
        return "";
    }

    return `

        <div
            class="detail-period-selector"
            data-detail-id="${detailId}">

            ${periods.map(
                period => `

                    <button
                        class="
                            detail-period-button
                            ${
                                period === currentPeriod
                                    ? "active"
                                    : ""
                            }
                        "
                        data-detail-period="${period}"
                        data-detail-id="${detailId}">

                        ${detailPeriodLabel(period)}

                    </button>

                `
            ).join("")}

        </div>

    `;

}


/* ============================================================
   詳細銘柄グラフ
============================================================ */

function renderStockDetailChart(
    container,
    stocks,
    title,
    defaultPeriod
) {

    if (!stocks || stocks.length === 0) {

        container.innerHTML = `
            <div class="no-data">
                銘柄データがありません
            </div>
        `;

        return;
    }


    const detailId =
        "detail-chart-" +
        (++detailChartCounter);


    container.innerHTML = `

        <h3 class="detail-title">
            ${escapeHtml(title)}
        </h3>

        ${renderDetailPeriodButtons(
            detailId,
            defaultPeriod
        )}

        <div class="detail-chart-container">

            <canvas id="${detailId}"></canvas>

        </div>

        <div
            id="${detailId}-ranking"
            class="stock-ranking">
        </div>

    `;


    drawStockDetail(
        detailId,
        stocks,
        defaultPeriod
    );

}


/* ============================================================
   詳細銘柄グラフ描画
============================================================ */

function drawStockDetail(
    detailId,
    stocks,
    detailPeriod
) {

    const items =
        stocks.map(
            stock => {

                return {

                    name: stock.name,

                    history:
                        getStockHistory(
                            stock,
                            detailPeriod
                        )

                };

            }
        );


    createLineChart(
        detailId,
        items,
        ""
    );


    const ranking =
        document.getElementById(
            detailId + "-ranking"
        );

    if (!ranking) {
        return;
    }


    ranking.innerHTML =
        stocks.map(
            (stock, index) => {

                let change =
                    stock.change_percent;


                // 拡張グラフの場合でも
                // 基本のランキング値は
                // 全体期間の値を表示

                return `

                    <div class="stock-row">

                        <div class="stock-rank">
                            ${index + 1}
                        </div>

                        <div class="stock-name">

                            ${escapeHtml(
                                stock.name
                            )}

                            <span class="stock-code">
                                ${escapeHtml(
                                    stock.code
                                )}
                            </span>

                        </div>

                        <div class="stock-price">
                            ${Number(
                                stock.price || 0
                            ).toLocaleString()}
                        </div>

                        <div class="
                            stock-change
                            ${changeClass(change)}
                        ">
                            ${formatChange(change)}
                        </div>

                    </div>

                `;

            }
        ).join("");


    // 期間ボタンのイベント
    const buttons =
        document.querySelectorAll(
            `[data-detail-id="${detailId}"]`
            + ` [data-detail-period]`
        );


    buttons.forEach(
        button => {

            button.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    const newPeriod =
                        this.dataset.detailPeriod;

                    // 現在のグラフを破棄
                    const canvas =
                        document.getElementById(
                            detailId
                        );

                    if (canvas) {

                        const chart =
                            Chart.getChart(
                                canvas
                            );

                        if (chart) {
                            chart.destroy();
                        }

                    }

                    // active切り替え
                    const parent =
                        this.parentElement;

                    parent
                        .querySelectorAll(
                            ".detail-period-button"
                        )
                        .forEach(
                            btn =>
                                btn.classList.remove(
                                    "active"
                                )
                        );

                    this.classList.add(
                        "active"
                    );

                    drawStockDetail(
                        detailId,
                        stocks,
                        newPeriod
                    );

                }
            );

        }
    );

}


/* ============================================================
   業界詳細
============================================================ */

function openIndustryDetail(
    index,
    dataset
) {

    const detail =
        document.getElementById(
            "industry-detail-" + index
        );

    if (!detail) {
        return;
    }


    // すでに開いている場合は閉じる
    if (detail.classList.contains("open")) {

        detail.classList.remove("open");
        detail.innerHTML = "";

        return;
    }


    // いったん他の業界詳細を閉じる
    document
        .querySelectorAll(
            ".detail.open"
        )
        .forEach(
            el => {

                el.classList.remove(
                    "open"
                );

                el.innerHTML = "";

            }
        );


    const industries =
        dataset.industries || [];

    if (!industries[index]) {
        return;
    }


    const industry =
        industries[index].industry;


    const stocks =
        dataset.industry_stocks?.[
            industry
        ] || [];


    detail.classList.add("open");


    renderStockDetailChart(
        detail,
        stocks,
        industry + " 関連銘柄",
        selectedPeriod
    );

}


/* ============================================================
   テーマ詳細
============================================================ */

function openThemeDetail(
    index,
    dataset
) {

    const detail =
        document.getElementById(
            "theme-detail-" + index
        );

    if (!detail) {
        return;
    }


    // すでに開いている場合は閉じる
    if (detail.classList.contains("open")) {

        detail.classList.remove("open");
        detail.innerHTML = "";

        return;
    }


    // 他の詳細を閉じる
    document
        .querySelectorAll(
            ".detail.open"
        )
        .forEach(
            el => {

                el.classList.remove(
                    "open"
                );

                el.innerHTML = "";

            }
        );


    const themes =
        dataset.themes || [];

    if (!themes[index]) {
        return;
    }


    const theme =
        themes[index].theme;


    const stocks =
        dataset.theme_stocks?.[
            theme
        ] || [];


    detail.classList.add("open");


    renderStockDetailChart(
        detail,
        stocks,
        theme + " 関連銘柄",
        selectedPeriod
    );

}


/* ============================================================
   ランキングのクリックイベント
============================================================ */

function setupRankingEvents(dataset) {

    document
        .querySelectorAll(
            ".ranking-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function() {

                        const type =
                            this.dataset.type;

                        const index =
                            Number(
                                this.dataset.index
                            );


                        if (
                            type === "industry"
                        ) {

                            openIndustryDetail(
                                index,
                                dataset
                            );

                        }


                        if (
                            type === "theme"
                        ) {

                            openThemeDetail(
                                index,
                                dataset
                            );

                        }

                    }
                );

            }
        );

}


/* ============================================================
   全体を描画
============================================================ */

function render() {

    if (!DATA) {
        return;
    }


    destroyCharts();

    detailChartCounter = 0;


    const dataset =
        DATA[selectedPeriod];


    if (!dataset) {

        document.getElementById(
            "app"
        ).innerHTML = `

            <div class="error">
                ${periodLabel(
                    selectedPeriod
                )} のデータがありません。
            </div>

        `;

        return;
    }


    const app =
        document.getElementById(
            "app"
        );


    app.innerHTML = `

        ${renderIndustryTop10(
            dataset
        )}

        ${renderIndustryRanking(
            dataset
        )}

        ${renderThemeTop10(
            dataset
        )}

        ${renderThemeRanking(
            dataset
        )}

        ${renderTopGainers(
            dataset
        )}

    `;


    // --------------------------------------------------------
    // 業界TOP10グラフ
    // --------------------------------------------------------

    const industryItems =
        dataset.top_industries || [];


    if (industryItems.length > 0) {

        createLineChart(
            "industryTopChart",
            industryItems.map(
                item => {

                    return {

                        industry:
                            item.industry,

                        name:
                            item.industry,

                        history:
                            item.history || []

                    };

                }
            ),
            ""
        );

    }


    // --------------------------------------------------------
    // テーマTOP10グラフ
    // --------------------------------------------------------

    const themeItems =
        dataset.top_themes || [];


    if (themeItems.length > 0) {

        createLineChart(
            "themeTopChart",
            themeItems.map(
                item => {

                    return {

                        theme:
                            item.theme,

                        name:
                            item.theme,

                        history:
                            item.history || []

                    };

                }
            ),
            ""
        );

    }


    setupRankingEvents(
        dataset
    );

}


/* ============================================================
   期間ボタン
============================================================ */

function setupPeriodButtons() {

    document
        .querySelectorAll(
            ".period-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function() {

                        const period =
                            this.dataset.period;


                        if (
                            !DATA ||
                            !DATA[period]
                        ) {

                            alert(
                                periodLabel(
                                    period
                                )
                                + "のデータがありません。"
                            );

                            return;
                        }


                        selectedPeriod =
                            period;


                        document
                            .querySelectorAll(
                                ".period-button"
                            )
                            .forEach(
                                btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                            );


                        this.classList.add(
                            "active"
                        );


                        render();

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });

                    }
                );

            }
        );

}


/* ============================================================
   データ読み込み
============================================================ */

async function loadData() {

    try {

        const response =
            await fetch(
                "./data.json?ts="
                + Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "data.jsonを読み込めませんでした"
            );

        }


        DATA =
            await response.json();


        document.getElementById(
            "updated"
        ).textContent =
            "最終更新："
            + (
                DATA.updated_at
                || "不明"
            );


        setupPeriodButtons();

        render();


    } catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "app"
        ).innerHTML = `

            <div class="error">

                データの読み込みに失敗しました。<br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* ============================================================
   起動
============================================================ */

loadData();

</script>

</body>
</html>
