<script>


/* ==================================================
   グローバル
================================================== */

let DATA = null;

let selectedPeriod = "1m";

let industryChart = null;

let themeChart = null;

let detailCharts = {};

let detailPeriods = {};


/*
   TOP10グラフ選択状態

   null
   → 全部表示

   数値
   → その番号だけ表示
*/

let topChartSelected = {

    industry: null,

    theme: null

};


/*
   業界・テーマ詳細グラフで
   選択されている銘柄

   stateKeyごとに管理
*/

let detailStockSelected = {};



/* ==================================================
   最新データと、その一つ前のデータの順位比較
================================================== */

/*
   localStorageの「前回アクセス時」の順位は使わない。

   data.jsonに入っている最新の株価データを「今回」とし、
   各銘柄のhistoryの一つ前のデータを「前回」として順位を計算する。

   そのため、例えば平日12時に開いた場合は
   最新の11時取得データと、その一つ前（通常は前営業日15時）の
   データを比較する。
*/
let previousRankingSnapshot = null;


/* ==================================================
   グラフカラー
================================================== */


const chartColors = [

    "#e74c3c",
    "#3498db",
    "#2ecc71",
    "#9b59b6",
    "#f39c12",
    "#1abc9c",
    "#e67e22",
    "#34495e",
    "#e84393",
    "#16a085"

];


/* ==================================================
   ランキング展開状態
================================================== */

let rankingExpanded = {

    industry: false,

    theme: false

};


/* ==================================================
   指定期間のランキングスナップショット作成
================================================== */

function buildPeriodRankingSnapshot(
    dataset,
    period,
    usePreviousData = false
) {

    const result = {

        industries: {},

        themes: {},

        industryStocks: {},

        themeStocks: {},

        gainers: {}

    };


    /*
       ------------------------------------------
       業界ランキング
       ------------------------------------------
    */

    const industries =
        groupListForPeriod(
            dataset,
            "industry",
            period,
            usePreviousData
        );


    industries.forEach(
        (
            item,
            index
        ) => {

            result.industries[
                item.industry
            ] =
                index + 1;

        }
    );


    /*
       ------------------------------------------
       テーマランキング
       ------------------------------------------
    */

    const themes =
        groupListForPeriod(
            dataset,
            "theme",
            period,
            usePreviousData
        );


    themes.forEach(
        (
            item,
            index
        ) => {

            result.themes[
                item.theme
            ] =
                index + 1;

        }
    );


    /*
       ------------------------------------------
       業界内銘柄ランキング
       ------------------------------------------
    */

    const industryMap =
        dataset.industry_stocks
        || {};


    Object.keys(
        industryMap
    )
    .forEach(
        industryName => {

            const stocks =
                sortStocksByPeriod(
                    industryMap[
                        industryName
                    ] || [],
                    period,
                    usePreviousData
                );


            result.industryStocks[
                industryName
            ] = {};


            stocks.forEach(
                (
                    stock,
                    index
                ) => {

                    result.industryStocks[
                        industryName
                    ][
                        stockKey(stock)
                    ] =
                        index + 1;

                }
            );

        }
    );


    /*
       ------------------------------------------
       テーマ内銘柄ランキング
       ------------------------------------------
    */

    const themeMap =
        dataset.theme_stocks
        || {};


    Object.keys(
        themeMap
    )
    .forEach(
        themeName => {

            const stocks =
                sortStocksByPeriod(
                    themeMap[
                        themeName
                    ] || [],
                    period,
                    usePreviousData
                );


            result.themeStocks[
                themeName
            ] = {};


            stocks.forEach(
                (
                    stock,
                    index
                ) => {

                    result.themeStocks[
                        themeName
                    ][
                        stockKey(stock)
                    ] =
                        index + 1;

                }
            );

        }
    );


    /*
       ------------------------------------------
       値上がり銘柄TOP10
       ------------------------------------------
    */

    const gainers =
        sortStocksByPeriod(
            dataset.top_gainers || [],
            period,
            usePreviousData
        );


    gainers
        .slice(
            0,
            10
        )
        .forEach(
            (
                stock,
                index
            ) => {

                result.gainers[
                    stockKey(stock)
                ] =
                    index + 1;

            }
        );


    return result;

}


/* ==================================================
   銘柄を一意に識別
================================================== */

function stockKey(
    stock
) {

    if (!stock) {
        return "";
    }


    /*
       codeを基本キーにする。

       codeがない特殊なデータでも
       nameを利用する。
    */

    return String(
        stock.code
        ??
        stock.name
        ??
        ""
    );

}


/* ==================================================
   順位変動情報
================================================== */

/*
   currentRank:
       今回の順位

   previousRank:
       前回の順位

   戻り値:
       {
           className,
           text
       }
*/

function getRankMovement(
    previousRank,
    currentRank
) {

    /*
       前回データが存在しない場合は
       NEWなどを表示せず、何も表示しない。
    */

    if (
        previousRank === null ||
        previousRank === undefined ||
        !Number.isFinite(Number(previousRank))
    ) {

        return null;

    }


    /*
       順位が上がった
       例:
       8位 → 3位
    */

    if (
        currentRank <
        previousRank
    ) {

        return {

            className:
                "rank-up",

            text:
                "↑"

        };

    }


    /*
       順位が下がった
       例:
       3位 → 8位
    */

    if (
        currentRank >
        previousRank
    ) {

        return {

            className:
                "rank-down",

            text:
                "↓"

        };

    }


    /*
       順位変化なし
    */

    return {

        className:
            "rank-same",

        text:
            "→"

    };

}


/* ==================================================
   順位マークHTML
   ※矢印の横に前回順位を小さく表示
================================================== */

function rankMovementHtml(
    previousRank,
    currentRank
) {

    const movement =
        getRankMovement(
            previousRank,
            currentRank
        );


    /*
       前回順位がない場合は
       矢印も前回順位も表示しない。
    */

    if (!movement) {
        return "";
    }


    return `

        <span
            class="
                rank-movement
                ${movement.className}
            "
            title="
                前回 ${previousRank}位
            ">

            <span>
                ${movement.text}
            </span>

            <span class="rank-previous">
                ${previousRank}位
            </span>

        </span>

    `;

}


/* ==================================================
   日付を安全にDateへ変換
================================================== */

function parseDate(value) {

    if (!value) {
        return null;
    }

    const text =
        String(value);

    let date =
        new Date(
            text +
            (
                text.includes("T")
                    ? ""
                    : "T00:00:00"
            )
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        date =
            new Date(value);

    }

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return null;

    }

    return date;

}


/* ==================================================
   グラフ用日付表示
================================================== */

function formatChartDate(
    value,
    period
) {

    const date =
        parseDate(value);

    if (!date) {
        return String(value ?? "");
    }

    const month =
        date.getMonth() + 1;

    const day =
        date.getDate();


    if (
        period === "5y"
    ) {

        const year =
            String(
                date.getFullYear()
            ).slice(-2);

        return (
            year
            +
            "/"
            +
            month
        );

    }


    return (
        month
        +
        "/"
        +
        day
    );

}


/* ==================================================
   赤▽＋グレー縦線
================================================== */

const boundaryPlugin = {

    id:
        "boundaryMarker",

    afterDraw(
        chart,
        args,
        options
    ) {

        if (
            !options ||
            !options.date
        ) {

            return;

        }

        const labels =
            chart.data.labels || [];

        if (
            !labels.length
        ) {

            return;

        }

        const targetDate =
            parseDate(
                options.date
            );

        if (!targetDate) {
            return;
        }

        const target =
            targetDate.getTime();

        let index = -1;

        let best =
            Infinity;


        labels.forEach(
            (
                label,
                i
            ) => {

                const date =
                    parseDate(label);

                if (!date) {
                    return;
                }

                const diff =
                    Math.abs(
                        date.getTime()
                        -
                        target
                    );

                if (
                    diff < best
                ) {

                    best = diff;

                    index = i;

                }

            }
        );


        if (
            index < 0
        ) {

            return;

        }


        const x =
            chart.scales.x
                .getPixelForValue(
                    index
                );


        const area =
            chart.chartArea;

        const ctx =
            chart.ctx;


        ctx.save();


        ctx.strokeStyle =
            "#999";

        ctx.lineWidth = 1;

        ctx.setLineDash([]);


        ctx.beginPath();

        ctx.moveTo(
            x,
            area.top
        );

        ctx.lineTo(
            x,
            area.bottom
        );

        ctx.stroke();


        const y =
            area.top + 4;

        const size = 8;


        ctx.strokeStyle =
            "#d33";

        ctx.lineWidth = 2;

        ctx.lineJoin =
            "round";


        ctx.beginPath();

        ctx.moveTo(
            x - size,
            y
        );

        ctx.lineTo(
            x,
            y + size
        );

        ctx.lineTo(
            x + size,
            y
        );

        ctx.stroke();


        ctx.restore();

    }

};


Chart.register(
    boundaryPlugin
);


/* ==================================================
   履歴取得
================================================== */

function historyOf(
    stock,
    period,
    fixedTo1m = false
) {

    if (!stock) {
        return [];
    }

    const p =
        stock.periods || {};


    if (
        fixedTo1m &&
        period === "6m"
    ) {

        return (
            p.from_1m_6m &&
            p.from_1m_6m.history
        ) || [];

    }


    if (
        fixedTo1m &&
        period === "5y"
    ) {

        return (
            p.from_1m_5y &&
            p.from_1m_5y.history
        ) || [];

    }


    if (
        p[period] &&
        p[period].history
    ) {

        return p[period].history;

    }


    if (
        stock.history
    ) {

        return stock.history;

    }


    return [];

}


/* ==================================================
   グラフの最後の値から変化率
================================================== */

function changeFromHistory(
    history
) {

    if (
        !history ||
        !history.length
    ) {

        return null;

    }


    const last =
        Number(
            history[
                history.length - 1
            ].value
        );


    if (
        !Number.isFinite(last)
    ) {

        return null;

    }


    return last - 100;

}


/* ==================================================
   %表示
================================================== */

function formatPercent(
    value
) {

    const n =
        Number(value);

    if (
        !Number.isFinite(n)
    ) {

        return "--";

    }


    return (
        n >= 0
            ? "+"
            : ""
    )
    +
    n.toFixed(2)
    +
    "%";

}


/* ==================================================
   業界・テーマ平均
================================================== */


function groupAverageChange(
    stocks,
    period,
    usePreviousData = false
) {

    const values =
        (stocks || [])
        .map(
            stock =>
                changeFromHistory(
                    historyForRanking(
                        stock,
                        period,
                        usePreviousData
                    )
                )
        )
        .filter(
            value =>
                value !== null
        );


    if (
        !values.length
    ) {

        return null;

    }


    return (
        values.reduce(
            (
                a,
                b
            ) =>
                a + b,
            0
        )
        /
        values.length
    );

}


/* ==================================================
   業界・テーマ一覧
   ※指定期間を使える版
================================================== */


function groupListForPeriod(
    dataset,
    type,
    period,
    usePreviousData = false
) {

    const map =
        dataset[
            type === "industry"
                ? "industry_stocks"
                : "theme_stocks"
        ]
        || {};


    const key =
        type === "industry"
            ? "industry"
            : "theme";


    const names =
        Object.keys(map);


    return names
        .map(
            name => {

                const stocks =
                    map[name] || [];


                return {

                    [key]:
                        name,

                    stocks:
                        stocks,

                    change_percent:
                        groupAverageChange(
                            stocks,
                            period,
                            usePreviousData
                        )

                };

            }
        )
        .sort(
            (
                a,
                b
            ) =>
                (
                    b.change_percent ??
                    -Infinity
                )
                -
                (
                    a.change_percent ??
                    -Infinity
                )
        );

}


/* ==================================================
   現在選択中の期間の一覧
================================================== */

function groupList(
    dataset,
    type
) {

    return groupListForPeriod(
        dataset,
        type,
        selectedPeriod
    );

}



/* ==================================================
   ランキング計算用の履歴

   usePreviousData === false
   → 最新データまで含める

   usePreviousData === true
   → 最新の1点を除き、その一つ前のデータを
      「現在値」としてランキングを再計算する
================================================== */

function historyForRanking(
    stock,
    period,
    usePreviousData = false
) {

    const history =
        historyOf(
            stock,
            period
        );


    if (
        !usePreviousData
    ) {

        return history;

    }


    if (
        !history ||
        history.length < 2
    ) {

        return [];

    }


    return history.slice(
        0,
        -1
    );

}


/* ==================================================
   銘柄を順位順に並べる
================================================== */


function sortStocksByPeriod(
    stocks,
    period,
    usePreviousData = false
) {

    return [...(
        stocks || []
    )]
    .sort(
        (
            a,
            b
        ) => {

            const av =
                changeFromHistory(
                    historyForRanking(
                        a,
                        period,
                        usePreviousData
                    )
                );


            const bv =
                changeFromHistory(
                    historyForRanking(
                        b,
                        period,
                        usePreviousData
                    )
                );


            return (
                bv ??
                -Infinity
            )
            -
            (
                av ??
                -Infinity
            );

        }
    );

}

function createLineChart(
    canvas,
    datasets,
    labels,
    markerDate = null,

) {

        canvas.getContext(
            "2d"
        ),

        {

            type:

            data: {

                labels:
                    labels,

                datasets:
                    datasets

            },

            options: {

                responsive:
                    true,

                maintainAspectRatio:
                    false,

                layout: {

                    padding: {

                        left: 0,

                        right: 4,

                        top: 2,

                        bottom: 0

                    }

                },

                interaction: {

                    mode:
                        "index",

                    intersect:
                        false

                },

                plugins: {

                    legend: {

                        display:
                            false

                    },

                    boundaryMarker: {

                        date:
                            markerDate

                    }

                },

                scales: {

                    y: {

                        title: {

                            display:
                                false

                        },

                        ticks: {

                            padding:
                                2

                        }

                    },

                    x: {

                        ticks: {

                            maxRotation:
                                0,

                            minRotation:
                                0,

                            autoSkip:

                            maxTicksLimit:
                                8,

                            callback:
                                function(
                                    value,

                                ) {

                                        this.getLabelForValue(

                                        );

                                    );

                        }

                    }

                }

            }

        }

    );

}


/* ==================================================
   データセット作成
================================================== */

function makeDatasets(
    items,
    labelFunction,
    historyGetter
) {

    const allDates =
        new Set();


    const prepared =
        (items || [])

        .map(
            (
                item,
                index
            ) => {

                const history =
                    historyGetter(
                        item
                    );


                history.forEach(
                    point => {

                        if (
                            point &&
                            point.date
                        ) {

                            allDates.add(
                                point.date
                            );

                        }

                    }
                );


                return {

                    item:
                        item,

                    history:
                        history,

                    index:
                        index

                };

            }
        );


    const labels =
        Array.from(
            allDates
        )
        .sort(
            (
                a,
                b
            ) => {

                const da =
                    parseDate(a);

                const db =
                    parseDate(b);

                if (
                    !da ||
                    !db
                ) {

                    return 0;

                }

                return (
                    da.getTime()
                    -
                    db.getTime()
                );

            }
        );


    const datasets =
        prepared.map(
            ({
                item,
                history,
                index
            }) => {

                const map = {};


                history.forEach(
                    point => {

                        map[
                            point.date
                        ] =
                            point.value;

                    }
                );


                return {

                    label:
                        labelFunction(
                            item
                        ),

                    data:
                        labels.map(
                            date =>
                                map[date]
                                ??
                                null
                        ),

                    borderWidth:
                        2,

                    pointRadius:
                        0,

                    tension:
                        0.2,

                    spanGaps:
                        true,

                    borderColor:
                        chartColors[
                            index %
                            chartColors.length
                        ]

                };

            }
        );


    return {

        labels:
            labels,

        datasets:
            datasets

    };

}


/* ==================================================
   境界日を取得
================================================== */

function getMarkerDate(
    history,
    monthsBack
) {

    if (
        !history ||
        !history.length
    ) {

        return null;

    }


    const validDates =
        history

        .map(
            point =>
                parseDate(
                    point.date
                )
        )

        .filter(
            date =>
                date !== null
        );


    if (
        !validDates.length
    ) {

        return null;

    }


    const latest =
        new Date(
            Math.max(
                ...validDates.map(
                    d =>
                        d.getTime()
                )
            )
        );


    latest.setMonth(
        latest.getMonth()
        -
        monthsBack
    );


    const year =
        latest.getFullYear();


    const month =
        String(
            latest.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            latest.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year
        +
        "-"
        +
        month
        +
        "-"
        +
        day
    );

}


/* ==================================================
   TOP10
================================================== */

function topItems(
    dataset,
    type
) {

    const key =
        type === "industry"
            ? "industry"
            : "theme";


    const source =
        dataset[
            type === "industry"
                ? "top_industries"
                : "top_themes"
        ]
        || [];


    const groups =
        groupList(
            dataset,
            type
        );


    const byName =
        new Map(
            groups.map(
                item =>
                    [
                        item[key],
                        item
                    ]
            )
        );


    return source

        .map(
            item => {

                const group =
                    byName.get(
                        item[key]
                    );


                return group
                    ? {
                        ...item,
                        ...group
                    }
                    : item;

            }
        )

        .sort(
            (
                a,
                b
            ) =>
                (
                    b.change_percent ??
                    -Infinity
                )
                -
                (
                    a.change_percent ??
                    -Infinity
                )
        )

        .slice(
            0,
            10
        );

}

function renderGroupRanking(

) {

    const dataset =

            button.innerHTML = `

                                ? "positive"
                                : "negative"

                        value
                    )}

                </span>

                ${rankMovementHtml(
                    previousRank,
                    currentRank
                )}

                <span class="arrow">
                    ▼
                </span>

            `;


            const detail =
                document.createElement(
                    "div"
                );


            detail.className =
                "detail";


            detail.innerHTML = `

                <div class="detail-title">

                    ${escapeHtml(name)}
                    ${
                        type === "industry"
                            ? " の銘柄"
                            : " 関連銘柄"
                    }

                </div>


                <div
                    class="detail-period-bar">

                    <button
                        class="

                            active
                        "
                        data-period="1m">

                        1月

                    </button>


                    <button
                        class="detail-period-button"
                        data-period="6m">

                        半年

                    </button>


                    <button
                        class="detail-period-button"
                        data-period="5y">

                        5年

                    </button>

                </div>


                <div class="detail-chart">

                    <canvas></canvas>

                </div>


                <div
                    class="detail-stock-ranking">
                </div>

            `;


            row.appendChild(
                button
            );

            row.appendChild(
                detail
            );

            container.appendChild(
                row
            );


            const stateKey =
                `${type}:${name}`;


            if (
                detailPeriods[
                    stateKey
                ] === undefined
            ) {

                detailPeriods[
                    stateKey
                ] = "1m";

            }


            detailStockSelected[
                stateKey
            ] = null;


            const draw =
                () => {

                    const period =
                        detailPeriods[
                            stateKey
                        ];


                    detail
                        .querySelectorAll(
                            ".detail-period-button"
                        )
                        .forEach(
                            b => {

                                b.classList.toggle(

                                    "active",

                                    b.dataset.period
                                    ===
                                    period

                                );

                        );


                    renderGroupDetailChart(

                        type,

                        name,

                        detail,

                        stateKey,

                        period

                    );

                        detail.querySelector(
                            ".detail-stock-ranking"
                        ),

                        stocks,

                        period,

                        false,

                        stateKey,

                        type,

                        name

                    );

                };


            /*
               詳細期間変更
            */

            detail
                .querySelectorAll(
                    ".detail-period-button"
                )
                .forEach(
                    b => {

                        b.addEventListener(
                            "click",

                                e.stopPropagation();

                                    stateKey
                                ] = null;


                                draw();

            button.addEventListener(

                    const open =

                    document

                );

            }
        );


        container.appendChild(
            expandButton
        );

    }

/* ==================================================
   前回の業界・テーマ順位を取得
================================================== */

function getPreviousGroupRank(
    type,
    name,
    period
) {

    if (
        !previousRankingSnapshot ||
        !previousRankingSnapshot.periods ||
        !previousRankingSnapshot.periods[
            period
        ]
    ) {

        return null;

    }


    const snapshot =
        previousRankingSnapshot
            .periods[
                period
            ];


    const map =
        type === "industry"
            ? snapshot.industries
            : snapshot.themes;


    if (
        !map
    ) {

        return null;

    }


    const rank =
        map[name];


    return Number.isFinite(
        Number(rank)
    )
        ? Number(rank)
        : null;

}

    ) {

        container.innerHTML =
            '<div class="no-data">銘柄データがありません</div>';

        return;

    }


    sorted.forEach(
        (
            stock,
            index
        ) => {

            const value =
                changeFromHistory(
                    historyOf(
                        stock,
                        period
                    )
                );


            const currentRank =
                index + 1;


            /*
               前回順位取得
            */

            const previousRank =
                getPreviousStockRank(
                    parentType,
                    parentName,
                    stock,
                    period,
                    expandable
                );


            const row =
                document.createElement(
                    "div"
                );


            const isChartStock =
                !expandable &&
                stateKey !== null;


            row.className =
                "stock-row"
                +
                (
                    expandable ||
                    isChartStock
                        ? " clickable"
                        : ""
                )
                +
                (
                    isChartStock
                        ? " chart-stock"
                        : ""
                );


            row.innerHTML = `

                <span class="stock-rank">
                    ${currentRank}
                </span>

                <span class="stock-code">
                    ${escapeHtml(
                        stock.code
                    )}
                </span>

                <span class="stock-name">
                    ${escapeHtml(
                        stock.name
                    )}
                </span>

                <span
                    class="
                        stock-change
                        ${
                            value >= 0
                                ? "positive"
                                : "negative"
                        }
                    ">

                    ${formatPercent(
                        value
                    )}

                </span>

                ${rankMovementHtml(
                    previousRank,
                    currentRank
                )}

                ${
                    expandable
                        ? '<span class="stock-arrow">▼</span>'
                        : ''
                }

            `;


            container.appendChild(
                row
            );


            /*
               ------------------------------------------
               業界・テーマ内銘柄
               ------------------------------------------
            */

            if (
                isChartStock
            ) {

                row.addEventListener(
                    "click",
                    () => {

                        toggleDetailStock(

                            stateKey,

                            index,

                            container

                        );

                    }
                );

            }


            /*
               ------------------------------------------
               値上がり銘柄TOP10
               ------------------------------------------
            */

            if (
                expandable
            ) {

                const detail =
                    document.createElement(
                        "div"
                    );


                detail.className =
                    "stock-detail";


                detail.innerHTML = `

                    <div
                        class="detail-period-bar">

                        <button
                            class="
                                detail-period-button
                                ${
                                    period === "1m"
                                        ? "active"
                                        : ""
                                }
                            "
                            data-period="1m">

                            1月

                        </button>


                        <button
                            class="
                                detail-period-button
                                ${
                                    period === "6m"
                                        ? "active"
                                        : ""
                                }
                            "
                            data-period="6m">

                            半年

                        </button>


                        <button
                            class="
                                detail-period-button
                                ${
                                    period === "5y"
                                        ? "active"
                                        : ""
                                }
                            "
                            data-period="5y">

                            5年

                        </button>

                    </div>


                    <div
                        class="detail-chart">

                        <canvas></canvas>

                    </div>

                `;


                container.appendChild(
                    detail
                );


                let currentPeriod =
                    period;


                const key =
                    `stock:${stock.code}:${Math.random()}`;


                const draw =
                    () => {

                        detail
                            .querySelectorAll(
                                ".detail-period-button"
                            )
                            .forEach(
                                b => {

                                    b.classList.toggle(

                                        "active",

                                        b.dataset.period
                                        ===
                                        currentPeriod

                                    );

                                }
                            );


                        const prepared =
                            makeDatasets(

                                [stock],

                                s =>
                                    `${s.code} ${s.name}`,

                                s =>
                                    historyOf(
                                        s,
                                        currentPeriod,
                                        true
                                    )

                            );


                        let markerDate =
                            null;


                        if (
                            currentPeriod ===
                            "6m"
                        ) {

                            markerDate =
                                getMarkerDate(

                                    historyOf(
                                        stock,
                                        currentPeriod,
                                        true
                                    ),

                                    1

                                );

                        }


                        if (
                            currentPeriod ===
                            "5y"
                        ) {

                            markerDate =
                                getMarkerDate(

                                    historyOf(
                                        stock,
                                        currentPeriod,
                                        true
                                    ),

                                    6

                                );

                        }


                        if (
                            detailCharts[key]
                        ) {

                            detailCharts[
                                key
                            ].destroy();

                        }


                        const canvas =
                            detail.querySelector(
                                "canvas"
                            );


                        if (
                            !prepared.labels.length
                        ) {

                            canvas
                                .parentElement
                                .innerHTML =
                                '<div class="no-data">グラフデータがありません</div>';

                            return;

                        }


                        detailCharts[key] =
                            createLineChart(

                                canvas,

                                prepared.datasets,

                                prepared.labels,

                                markerDate,

                                currentPeriod

                            );

                    };


                row.addEventListener(
                    "click",
                    () => {

                        const open =
                            detail.classList.contains(
                                "open"
                            );


                        detail.classList.toggle(
                            "open",
                            !open
                        );


                        row
                            .querySelector(
                                ".stock-arrow"
                            )
                            .textContent =
                                open
                                    ? "▼"
                                    : "▲";


                        if (!open) {
                            draw();
                        }

                    }
                );


                detail
                    .querySelectorAll(
                        ".detail-period-button"
                    )
                    .forEach(
                        b => {

                            b.addEventListener(
                                "click",
                                e => {

                                    e.stopPropagation();


                                    currentPeriod =
                                        b.dataset.period;


                                    draw();

                                }
                            );

                        }
                    );

            }

        }
    );


    /*
       初期選択状態
    */

    if (
        stateKey !== null
    ) {

        updateStockSelectionStyle(

            container,

            detailStockSelected[
                stateKey
            ] ?? null

        );

    }

}


/* ==================================================
   前回の銘柄順位を取得
================================================== */

function getPreviousStockRank(
    parentType,
    parentName,
    stock,
    period,
    expandable
) {

    if (
        !previousRankingSnapshot ||
        !previousRankingSnapshot.periods ||
        !previousRankingSnapshot.periods[
            period
        ]
    ) {

        return null;

    }


    const snapshot =
        previousRankingSnapshot
            .periods[
                period
            ];


    const key =
        stockKey(stock);


    /*
       expandable === true
       → 値上がり銘柄TOP10
    */

    if (
        expandable
    ) {

        if (
            !snapshot.gainers
        ) {

            return null;

        }


        return Number.isFinite(
            Number(
                snapshot.gainers[key]
            )
        )
            ? Number(
                snapshot.gainers[key]
            )
            : null;

    }


    /*
       業界内銘柄
    */

    if (
        parentType === "industry"
    ) {

        if (
            !snapshot.industryStocks ||
            !snapshot.industryStocks[
                parentName
            ]
        ) {

            return null;

        }


        return Number.isFinite(
            Number(
                snapshot.industryStocks[
                    parentName
                ][key]
            )
        )
            ? Number(
                snapshot.industryStocks[
                    parentName
                ][key]
            )
            : null;

    }


    /*
       テーマ内銘柄
    */

    if (
        parentType === "theme"
    ) {

        if (
            !snapshot.themeStocks ||
            !snapshot.themeStocks[
                parentName
            ]
        ) {

            return null;

        }


        return Number.isFinite(
            Number(
                snapshot.themeStocks[
                    parentName
                ][key]
            )
        )
            ? Number(
                snapshot.themeStocks[
                    parentName
                ][key]
            )
            : null;

    }


    return null;

}


/* ==================================================
   値上がり銘柄TOP10
================================================== */

function renderGainers() {

    const dataset =
        DATA[
            selectedPeriod
        ];


    const container =
        document.getElementById(
            "stockRanking"
        );


    const title =
        document.getElementById(
            "gainerTitle"
        );


    title.textContent =
        `${periodLabel(
            selectedPeriod
        )} 値上がり銘柄 TOP10`;


    container.innerHTML =
        "";


    const stocks =
        dataset.top_gainers
        || [];


    if (
        !stocks.length
    ) {

        container.innerHTML =
            '<div class="no-data">銘柄データがありません</div>';

        return;

    }


    renderStockList(

        container,

        stocks,

        selectedPeriod,

        true,

        null,

        null,

        null

    );

}


/* ==================================================
   期間名
================================================== */

function periodLabel(
    period
) {

    if (
        period === "1m"
    ) {

        return "1か月";

    }


    if (
        period === "6m"
    ) {

        return "半年";

    }


    return "5年";

}


/* ==================================================
   ページ全体を描画
================================================== */

function renderAll() {

    document
        .querySelectorAll(
            "#globalPeriodBar .period-button"
        )
        .forEach(
            button => {

                button.classList.toggle(

                    "active",

                    button.dataset.period
                    ===
                    selectedPeriod

                );

            }
        );


    /*
       期間を変えたときは
       グラフ選択をリセット
    */

    topChartSelected.industry =
        null;

    topChartSelected.theme =
        null;


    detailStockSelected = {};


    renderTopChart(
        "industry"
    );

    renderGroupRanking(
        "industry"
    );


    renderTopChart(
        "theme"
    );

    renderGroupRanking(
        "theme"
    );


    renderGainers();

}


/* ==================================================
   一番上の期間ボタン
================================================== */

function setupGlobalPeriodButtons() {

    document
        .querySelectorAll(
            "#globalPeriodBar .period-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const next =
                            button.dataset.period;


                        if (
                            next ===
                            selectedPeriod
                        ) {

                            return;

                        }


                        const scrollY =
                            window.scrollY
                            ||
                            window.pageYOffset
                            ||
                            0;


                        selectedPeriod =
                            next;


                        rankingExpanded.industry =
                            false;

                        rankingExpanded.theme =
                            false;


                        /*
                           ここでは
                           localStorageを更新しない。

                           前回アクセス時のデータと
                           引き続き比較するため。
                        */

                        renderAll();


                        requestAnimationFrame(
                            () => {

                                requestAnimationFrame(
                                    () => {

                                        window.scrollTo(
                                            0,
                                            scrollY
                                        );

                                    }
                                );

                            }
                        );

                    }
                );

            }
        );

}


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==================================================
   data.json取得
================================================== */

fetch(
    "data.json",
    {
        cache:
            "no-store"
    }
)

.then(
    response => {

        if (
            !response.ok
        ) {

            throw new Error(
                "data.json の取得に失敗しました"
            );

        }


        return response.json();

    }
)

.then(
    data => {

        DATA =
            data;


        document
            .getElementById(
                "updated"
            )
            .textContent =
            "最終更新: "
            +
            data.updated_at;


setupGlobalPeriodButtons();


/*
   最新データの一つ前のデータから
   「前回順位」を作る。

   ここではlocalStorageを使わない。
   したがって、サイトをいつ開いたかではなく、
   data.json内の最新データと、その直前のデータを比較する。
*/
previousRankingSnapshot = {
    savedAt:
        data.updated_at,
    periods: {}
};


[
    "1m",
    "6m",
    "5y"
]
.forEach(
    period => {

        const dataset =
            DATA[period];


        if (!dataset) {
            return;
        }


        previousRankingSnapshot.periods[
            period
        ] =
            buildPeriodRankingSnapshot(
                dataset,
                period,
                true
            );

    }
);


/*
   前回順位は
   「最新データの一つ前」の順位。
   これを保持したまま画面を描画する。
*/
renderAll();

    }
)

.catch(
    error => {

        console.error(
            error
        );


        document
            .getElementById(
                "updated"
            )
            .textContent =
            "データ取得エラー";

    }
);


</script>
